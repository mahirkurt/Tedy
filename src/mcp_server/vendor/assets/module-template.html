  /* ---- v3.0.0 — Task 10: Sefer mini-haritası (opsiyonel; meta.quest.stations,
     gamified-flows.md §2.2/§3.2 — istasyon[0].completed=bahşedilmiş ilerleme) ---- */
  function renderQuestMap(){
    const box=$("#questMap"); if(!box) return;
    const stations = D.meta && D.meta.quest && D.meta.quest.stations;
    if(!stations || !stations.length){ box.hidden=true; box.innerHTML=""; return; }
    box.hidden=false;
    const n=stations.length, W=Math.max(220,n*70), H=56, cy=22, r=9, gap=W/n;
    let lines="", nodes="", doneCount=0;
    stations.forEach((st,i)=>{
      const cx=gap*(i+0.5);
      const done = st.completed===true || state.done.has(st.id);
      if(done) doneCount++;
      if(i>0){
        const px=gap*(i-0.5);
        lines+=`<line x1="${px.toFixed(1)}" y1="${cy}" x2="${cx.toFixed(1)}" y2="${cy}" class="quest-map__line${done?" quest-map__line--done":""}"></line>`;
      }
      nodes+=`<circle cx="${cx.toFixed(1)}" cy="${cy}" r="${r}" class="quest-map__node${done?" quest-map__node--done":""}"></circle>`
        +`<text x="${cx.toFixed(1)}" y="${cy+r+14}" text-anchor="middle" class="quest-map__label">${esc(st.label||"")}</text>`;
    });
    const tid="qm"+Math.random().toString(36).slice(2,8);
    box.innerHTML=`<svg class="quest-map__svg" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${tid}">`
      +`<title id="${tid}">Sefer haritası: ${stations.length} istasyondan ${doneCount} tamamlandı</title>`
      +lines+nodes+`</svg>`;
  }
  function updateRail(){
    renderStepper();
    renderQuestMap();
    $("#railText").textContent = state.idx>=segs.length
      ? "Tamamlandı" : `Bölüm ${Math.min(state.idx,segs.length-1)+1} / ${segs.length}`;
  }

  /* ---- navigasyon ---- */
  function goNext(){
    if(state.idx<segs.length){ state.done.add(segs[state.idx].id); }
    state.idx++; persistSession(); render();
  }
  function goBack(){ if(state.idx>0){ state.idx--; render(); } }
  function setNav({back=true, next=true, nextLabel="Devam", nextEnabled=true}={}){
    const b=$("#backBtn"), n=$("#nextBtn");
    b.style.visibility = back && state.idx>0 ? "visible":"hidden";
    n.style.display = next ? "inline-flex":"none";
    n.disabled = !nextEnabled;
    n.innerHTML = nextLabel+" "+icon("ic-arrow-right");
  }
  function focusStageHeading(stage){
    const target=stage.querySelector('[data-stage-heading="true"]')||stage;
    if(target&&typeof target.focus==="function") target.focus({preventScroll:true});
  }
  function focusFirstUsableOption(stage){
    const target=stage.querySelector(".opt:not([disabled]),.chip-btn:not([disabled]),.hook-opt:not([disabled])");
    if(target) target.focus({preventScroll:true}); else focusStageHeading(stage);
  }
  function focusActionButton(button){
    if(button&&typeof button.focus==="function") button.focus({preventScroll:true});
  }
  function objectivesBlock(title){
    const items=Array.isArray(D.objectives)
      ? D.objectives.filter(x=>typeof x==="string"&&x.trim()) : [];
    if(!items.length) return "";
    return `<section class="objectives" aria-labelledby="objectivesTitle">`
      +`<h3 id="objectivesTitle">${esc(title||"Bu modülde")}</h3><ul>`
      +items.map(item=>`<li>${esc(item)}</li>`).join("")+`</ul></section>`;
  }
  function mountObjectives(stage){
    const html=objectivesBlock("Bu modülde");
    if(!html) return;
    const head=stage.querySelector(".seg-head");
    if(head) head.insertAdjacentHTML("afterend",html);
    else stage.insertAdjacentHTML("afterbegin",html);
  }

  /* ---- ana render ---- */
  function render(){
    clearSectionTimers();
    ttsCancel();
    const stage=$("#stage"); stage.innerHTML=""; stage.removeAttribute("data-seg");
    stage.removeAttribute("data-hook-resolved"); // her render'da temizlenir; yalnız çözen teach yeniden yazar
    updateRail();
    if(state.idx>=segs.length){ renderSummary(stage); focusStageHeading(stage); return; }
    const s=segs[state.idx];
    stage.setAttribute("data-seg", s.type);
    const fn = ({hook:renderHook,teach:renderTeach,mcq:renderMCQ,flashcards:renderFlashcards,
      match:renderMatch,fillblank:renderFillblank,worked:renderWorked,selfExplain:renderSelfExplain,
      sim:renderSim,conceptMap:renderConceptMap,
      brainbreak:renderBreak,checkpoint:renderCheckpoint,order:renderOrder,sorting:renderSorting,
      hotspot:renderHotspot,timeline:renderTimeline,chart:renderChart,
      table:renderTable,numberline:renderNumberline,fraction:renderFraction,
      diagram:renderDiagram,flow:renderFlow,cards:renderCards,gloss:renderGloss,dialogue:renderDialogue})[s.type];
    (fn||renderTeach)(stage,s);
    focusStageHeading(stage);
    if(state.idx===0) mountObjectives(stage);
    window.scrollTo({top:0,behavior:"instant"});
  }

  function segHead(s, kicker){
    return `<div class="seg-head"><span class="seg-ic">${icon(s.pictogram||"pic-idea","pic",32)}</span>
      <div>${kicker?`<div class="kicker">${kicker}</div>`:""}<h2 data-stage-heading="true" tabindex="-1">${s.title||""}</h2></div></div>`;
  }
  function instr(s){
    return s.instructions?`<p class="instructions">${icon("ic-info")}<span>${s.instructions}</span></p>`:"";
  }

  /* ---- teach ---- */
  function renderTeach(stage,s){
    let html = segHead(s,"Öğreniyorum");
    if(s.lead) html+=`<p class="lead">${s.lead}</p>`;
    html += `<div class="seg-body">${(s.body||[]).join("")}</div>`;
    if(s.visual && s.visual.kind==="svg") html+=svgFigure(s.visual.ref, s.visual.caption);
    else if(s.visual && s.visual.kind==="pictogram") html+=svgFigure(icon(s.visual.ref,"pic",96), s.visual.caption);
    else if(s.visual && s.visual.kind==="chart") html+=vizChart(s.visual);
    else if(s.visual && s.visual.kind==="table") html+=vizTable(s.visual);
    else if(s.visual && s.visual.kind==="numberline") html+=numberLine(Object.assign({}, s.visual, {interactive:false}));
    else if(s.visual && s.visual.kind==="fraction") html+=fractionBar(s.visual);
    else if(s.visual && s.visual.kind==="math") html+=mathFigure(s.visual.expr||s.visual.ref||"", s.visual.caption);
    else if(s.visual && s.visual.kind==="mathml") html+=mathmlFigure(s.visual.math||s.visual.ref||"", s.visual.caption);
    else if(s.visual && s.visual.kind==="labeled") html+=labeledFigure(s.visual);
    else if(s.visual && s.visual.kind==="flow") html+=relationFlow(s.visual);
    else if(s.visual && s.visual.kind==="cards") html+=infoCards(s.visual);
    else if(s.visual && s.visual.kind==="gloss") html+=glossSentence(s.visual);
    html+=ttsRow(stripTags((s.lead?s.lead+". ":"")+(s.body||[]).join(" ")), defLang());
    if(s.keyTerms&&s.keyTerms.length){
      html+=`<div class="terms"><span class="terms__lbl">Anahtar kavramlar</span><div class="terms__list">`+
        s.keyTerms.map(t=>`<button class="def-term" type="button" data-term="${esc(t.term)}" data-def="${esc(t.def)}"${t.icon?` data-icon="${esc(t.icon)}"`:""}${t.example?` data-ex="${esc(t.example)}"`:""}>${icon(t.icon||"ic-info")}<span>${esc(t.term)}</span></button>`).join("")+`</div></div>`;
    }
    stage.innerHTML=html;
    // merak-boşluğu kapanışı: bu teach bir hook'un resolvesIn hedefiyse, o hook'un
    // kimliğini DOM'a yaz (gamified-flows.md §3.1 — data-hook-resolved="<hookId>")
    const resolvedHook = segs.find(x=>x.type==="hook" && x.resolvesIn===s.id);
    if(resolvedHook) stage.setAttribute("data-hook-resolved", resolvedHook.id);
    setNav({nextLabel: state.idx===segs.length-1?"Bitir":"Devam"});
  }

  /* ---- hook: merak-boşluğu (segment içinde kapanır; gamified-flows.md §2.1/§3.1) ---- */
  function renderHook(stage,s){
    const hasPredict = !!(s.predict && s.predict.options && s.predict.options.length);
    const predictBlock = !hasPredict ? "" :
      `<div class="hook-predict" role="group" aria-label="Tahmin">`
      + s.predict.options.map((o,i)=>`<button class="hook-opt" type="button" data-i="${i}" aria-pressed="false">${esc(o)}</button>`).join("")
      + `</div>`
      + (s.predict.hintOnPick ? `<p class="hook-hint" id="hookHint" hidden>${icon("ic-info")}<span>${esc(s.predict.hintOnPick)}</span></p>` : "");
    stage.innerHTML = segHead(s,"Merak") + instr(s)
      + `<div class="hook-card" data-resolves="${esc(s.resolvesIn||"")}">`
      +   `<p class="hook-q">${icon("ic-help")}<span>${esc(s.question)}</span></p>`
      +   ttsRow(stripTags(s.question), defLang())
      +   predictBlock
      +   `<p class="hook-note">${hasPredict?"Tahminini seç — az sonra öğreneceğiz.":"Az sonra çözeceğiz."}</p>`
      + `</div>`;
    // tahmin ungraded: seçim yalnız vurgular, XP/puan/ceza yok (§2.1 — merak açık kalır, kapanış bir sonraki teach'te)
    stage.querySelectorAll(".hook-opt").forEach(b=>{
      b.addEventListener("click",()=>{
        stage.querySelectorAll(".hook-opt").forEach(x=>{ x.classList.remove("hook-opt--pick"); x.setAttribute("aria-pressed","false"); });
        b.classList.add("hook-opt--pick"); b.setAttribute("aria-pressed","true");
        const hint=$("#hookHint"); if(hint) hint.hidden=false;
      });
    });
    setNav({nextLabel:"Öğren"});
  }

  /* ---- mcq / checkpoint ortak akış ----
     Task 13: `hasTiers` yalnız bu segmentte >=1 soru gerçek tier(2|3) taşıyorsa
     true'dur; false ise aşağıdaki tüm uyarlama dalları erişilemezdir ve `order`
     kimlik izdüşümünde kalır (oi===qi) — tier'sız modüllerde davranış birebir
     korunur (bkz. yukarıdaki Task 13 motor notu). */
  function runQuestionSet(stage,s,questions,onComplete,kicker){
    let qi=0;
    const order=questions.map((_,i)=>i);
    const hasTiers=questions.some(q=>q.tier===2||q.tier===3);
    function showQ(){
      const missSignal = hasTiers && perfMissSignal();
      if(missSignal) tierAdaptSwap(order, questions, qi, true); // taban-koruma: en düşük tier öne
      const oi=order[qi], q=questions[oi];
      const tried={v:false};
      const hintFirst = missSignal && !!q.explanation;
      let html=segHead(s,kicker||"Yarışma")+instr(s);
      html+=`<div class="streak">Soru <b>${qi+1}</b> / <b>${questions.length}</b></div>`;
      html+=`<p class="q-stem">${q.stem}</p>`;
      html+=ttsRow(stripTags(q.stem), defLang());
      if(hintFirst) html+=`<div class="callout callout--info" data-adaptive="hint">${icon("ic-info")}<div><span class="callout__t">İpucu</span>${q.explanation}</div></div>`;
      html+=`<div class="opt-list" role="group" aria-label="Seçenekler">`;
      q.options.forEach((opt,i)=>{
        html+=`<button class="opt" type="button" data-i="${i}"><span class="opt__mark"></span><span>${opt}</span></button>`;
      });
      html+=`</div><div id="qfb" aria-live="polite"></div>`;
      stage.innerHTML=html;
      setNav({next:false});
      const gradeKey=s.id+"#"+oi;
      stage.querySelectorAll(".opt").forEach(btn=>{
        btn.addEventListener("click",()=>{
          const i=+btn.dataset.i;
          const correct = i===q.correctIndex;
          if(correct){
            btn.classList.add("opt--correct");
            btn.querySelector(".opt__mark").innerHTML=icon("ic-check");
            stage.querySelectorAll(".opt").forEach(b=>b.disabled=true);
            if(!state.awarded.has(gradeKey)){
              state.awarded.add(gradeKey);
              addXP(D.rewards.xpPerCorrect + (tried.v?0:(D.rewards.firstTryBonus||0)));
              markMastered();
              bumpStreak();
              perfPush(!tried.v);
            }
            const fb=$("#qfb"); fb.className="feedback feedback--ok";
            fb.innerHTML=icon("ic-check")+`<div><b>Doğru!</b>${q.explanation||""}</div>`;
            const last = qi===questions.length-1;
            const proceed=(challenge)=>{
              if(challenge) tierAdaptSwap(order, questions, qi+1, false);
              if(last){onComplete();} else {qi++;showQ();}
            };
            const nb=el("button","btn btn--primary"); nb.style.marginTop="var(--sp-05)";
            nb.innerHTML=(last?"Tamamla":"Sonraki soru")+" "+icon("ic-arrow-right");
            nb.addEventListener("click",()=>proceed(false));
            stage.appendChild(nb);
            if(!last && hasTiers && perfChallengeSignal() && hasTierAhead(order, questions, qi+1, 3)){
              const cb=el("button","btn btn--ghost"); cb.style.marginTop="var(--sp-03)";
              cb.setAttribute("data-adaptive","challenge");
              cb.innerHTML=icon("ic-target")+" Meydan Oku";
              cb.addEventListener("click",()=>proceed(true));
              stage.appendChild(cb);
            }
            focusActionButton(nb);
          } else {
            tried.v=true; state.flawlessMcq=false; resetStreak();
            btn.classList.add("opt--wrong");
            btn.querySelector(".opt__mark").innerHTML=icon("ic-close");
            btn.disabled=true;
            const fb=$("#qfb"); fb.className="feedback feedback--no"; playSound("retry");
            fb.innerHTML=icon("ic-close")+`<div><b>Tekrar dene.</b> İpucu: ${q.explanation?q.explanation:"seçenekleri yeniden oku."}</div>`;
            persistSession();
            focusFirstUsableOption(stage);
          }
        });
      });
      focusStageHeading(stage);
    }
    showQ();
  }
  function renderMCQ(stage,s){
    runQuestionSet(stage,s,s.questions,()=>{ if(state.flawlessMcq) awardByCondition("flawless-mcq"); goNext(); },"Mini Yarışma");
  }

  /* ---- match ---- */
  function renderMatch(stage,s){
    const pairs=s.pairs;
    const rights = pairs.map((p,j)=>({text:p.b,origin:j}));
    for(let i=rights.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rights[i],rights[j]]=[rights[j],rights[i]];}
    let html=segHead(s,"Eşleştir")+instr(s);
    html+=`<div class="match"><div class="match__col"><h3>Kavram</h3>`;
    pairs.forEach((p,i)=>{html+=`<button class="opt" type="button" data-side="L" data-i="${i}"><span class="opt__mark"></span><span>${p.a}</span></button>`;});
    html+=`</div><div class="match__col"><h3>Tanım</h3>`;
    rights.forEach(r=>{html+=`<button class="opt" type="button" data-side="R" data-origin="${r.origin}"><span>${r.text}</span></button>`;});
    html+=`</div></div><div id="mfb" aria-live="polite"></div>`;
    stage.innerHTML=html;
    setNav({next:false});
    let selL=null, matched=0;
    function clearSel(){selL=null; stage.querySelectorAll('[data-side="L"]').forEach(b=>b.classList.remove("opt--sel"));}
    stage.querySelectorAll('[data-side="L"]').forEach(b=>{
      b.addEventListener("click",()=>{ if(b.disabled)return; clearSel(); selL=b; b.classList.add("opt--sel"); });
    });
    stage.querySelectorAll('[data-side="R"]').forEach(b=>{
      b.addEventListener("click",()=>{
        if(b.disabled||!selL)return;
        const li=+selL.dataset.i, ro=+b.dataset.origin;
        if(li===ro){
          selL.classList.remove("opt--sel"); selL.classList.add("opt--correct");
          selL.querySelector(".opt__mark").innerHTML=icon("ic-check");
          selL.disabled=true; b.classList.add("opt--correct"); b.disabled=true;
          const gk=s.id+"#"+li;
          if(!state.awarded.has(gk)){state.awarded.add(gk);addXP(D.rewards.xpPerCorrect);markMastered();bumpStreak();}
          selL=null; matched++;
          if(matched===pairs.length){
            const fb=$("#mfb"); fb.className="feedback feedback--ok";
            fb.innerHTML=icon("ic-check")+`<div><b>Tümünü eşleştirdin!</b></div>`;
            setNav({nextLabel: state.idx===segs.length-1?"Bitir":"Devam"});
            focusActionButton($("#nextBtn"));
          } else {
            focusFirstUsableOption(stage);
          }
        } else {
          b.classList.add("opt--wrong");
          const bb=b; sectionTimeout(()=>bb.classList.remove("opt--wrong"),600);
          const fb=$("#mfb"); fb.className="feedback feedback--no"; playSound("retry"); resetStreak();
          fb.innerHTML=icon("ic-close")+`<div><b>Bu eşleşme değil.</b> Tekrar dene.</div>`;
          clearSel();
          focusFirstUsableOption(stage);
        }
      });
    });
  }

  /* ---- fillblank ----
     Task 13: aynı hasTiers muhafızı (bkz. runQuestionSet notu) — s.items'te
     >=1 gerçek tier(2|3) yoksa order kimlik izdüşümünde kalır, gk===s.id+"#"+ii
     (mevcut davranış birebir). */
  function renderFillblank(stage,s){
    let ii=0;
    const order=s.items.map((_,i)=>i);
    const hasTiers=s.items.some(x=>x.tier===2||x.tier===3);
    function showItem(){
      const missSignal = hasTiers && perfMissSignal();
      if(missSignal) tierAdaptSwap(order, s.items, ii, true); // taban-koruma: en düşük tier öne
      const oi=order[ii], it=s.items[oi];
      const sentence = it.text.replace("___",`<span class="blank" id="blankSpot">?</span>`);
      let pool = it.choices ? it.choices.slice() : s.items.map(x=>x.answer[0]);
      for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
      let html=segHead(s,"Boşluğu Doldur")+instr(s);
      html+=`<div class="streak">Cümle <b>${ii+1}</b> / <b>${s.items.length}</b></div>`;
      html+=`<p class="cloze">${sentence}</p>`;
      if(missSignal && it.hint) html+=`<div class="callout callout--info" data-adaptive="hint">${icon("ic-info")}<div><span class="callout__t">İpucu</span>${it.hint}</div></div>`;
      html+=`<div class="pool" role="group" aria-label="Kelime havuzu">`;
      pool.forEach(w=>{html+=`<button class="chip-btn" type="button" data-w="${esc(w)}">${w}</button>`;});
      html+=`</div><div id="ffb" aria-live="polite"></div>`;
      stage.innerHTML=html;
      setNav({next:false});
      const gk=s.id+"#"+oi; let tried=false;
      stage.querySelectorAll(".chip-btn").forEach(btn=>{
        btn.addEventListener("click",()=>{
          const w=btn.dataset.w;
          const ok=it.answer.map(norm).includes(norm(w));
          const blank=$("#blankSpot");
          if(ok){
            blank.textContent=w; blank.style.color="var(--cds-support-success)"; blank.style.borderColor="var(--cds-support-success)";
            stage.querySelectorAll(".chip-btn").forEach(b=>b.disabled=true);
            if(!state.awarded.has(gk)){state.awarded.add(gk);
              addXP(D.rewards.xpPerCorrect+(tried?0:(D.rewards.firstTryBonus||0)));markMastered();bumpStreak();
              perfPush(!tried);}
            const fb=$("#ffb"); fb.className="feedback feedback--ok";
            fb.innerHTML=icon("ic-check")+`<div><b>Doğru!</b></div>`;
            const last=ii===s.items.length-1;
            const proceed=(challenge)=>{
              if(challenge) tierAdaptSwap(order, s.items, ii+1, false);
              if(last){goNext();} else {ii++;showItem();}
            };
            const nb=el("button","btn btn--primary"); nb.style.marginTop="var(--sp-05)";
            nb.innerHTML=(last?"Tamamla":"Sonraki cümle")+" "+icon("ic-arrow-right");
            nb.addEventListener("click",()=>proceed(false));
            stage.appendChild(nb);
            if(!last && hasTiers && perfChallengeSignal() && hasTierAhead(order, s.items, ii+1, 3)){
              const cb=el("button","btn btn--ghost"); cb.style.marginTop="var(--sp-03)";
              cb.setAttribute("data-adaptive","challenge");
              cb.innerHTML=icon("ic-target")+" Meydan Oku";
              cb.addEventListener("click",()=>proceed(true));
              stage.appendChild(cb);
            }
            focusActionButton(nb);
          } else {
            tried=true; btn.disabled=true; btn.style.opacity=".4";
            const fb=$("#ffb"); fb.className="feedback feedback--no"; playSound("retry"); resetStreak();
            fb.innerHTML=icon("ic-close")+`<div><b>Bu değil.</b> İpucu: ${it.hint||"cümleyi yeniden oku."}</div>`;
            focusFirstUsableOption(stage);
          }
        });
      });
      focusStageHeading(stage);
    }
    showItem();
  }

  /* ---- worked: soluk-çözümlü örnek (fading worked example; math g=0.48, fading en güçlü
     alt-özellik — Barbieri 2023). fadeFrom öncesi adımlar salt-görünür (verilen çözüm),
     fadeFrom'dan itibaren adımlar <input aria-label> ile boşluk; tek "Kontrol et" tüm
     boşlukları birlikte değerlendirir (renderFillblank'in doğru-işareti deseni: token
     renk + ikon + metin). Yanlış = nazik/tekrar-denenebilir, ceza yok (G-WELLBEING). ---- */
  function renderWorked(stage,s){
    const steps=s.steps||[];
    const fadeFrom=(typeof s.fadeFrom==="number")?Math.max(0,s.fadeFrom):steps.length;
    const blankIdx=steps.map((_,i)=>i).filter(i=>i>=fadeFrom);
    let html=segHead(s,"Çözümlü Örnek")+instr(s);
    html+=ttsRow(stripTags((steps[0]&&steps[0].text)||""), defLang());
    html+=`<ol class="worked-steps">`;
    steps.forEach((st,i)=>{
      const solved=i<fadeFrom;
      html+=`<li class="worked-step${solved?" worked-step--solved":" worked-step--blank"}" data-i="${i}">`
        +`<span class="worked-step__num">${i+1}</span>`
        +`<span class="worked-step__text">${st.text||""}</span>`;
      if(!solved){
        html+=`<span class="worked-step__field">`
          +`<input class="worked-input" type="text" autocomplete="off" spellcheck="false" aria-label="Adım ${i+1} cevabı">`
          +`<span class="worked-mark" aria-hidden="true"></span>`
          +`</span>`;
      }
      html+=`</li>`;
    });
    html+=`</ol>`;
    if(blankIdx.length){
      html+=`<button class="btn btn--primary worked-check" type="button">${icon("ic-check")} Kontrol et</button>`;
      html+=`<div id="wfb" aria-live="polite"></div>`;
    }
    stage.innerHTML=html;

    if(!blankIdx.length){ setNav({nextLabel: state.idx===segs.length-1?"Bitir":"Devam"}); return; }
    setNav({next:false});

    const gk=s.id, solvedSet=new Set();
    let everWrong=false;
    function evalBlank(i){
      const li=stage.querySelector('.worked-step[data-i="'+i+'"]');
      const input=li.querySelector(".worked-input");
      const mark=li.querySelector(".worked-mark");
      const okList=[].concat(steps[i].answer==null?[]:steps[i].answer).map(norm);
      const ok=okList.includes(norm(input.value));
      li.classList.remove("worked-step--correct","worked-step--wrong");
      if(ok){
        li.classList.add("worked-step--correct");
        input.disabled=true; input.setAttribute("aria-invalid","false");
        mark.innerHTML=icon("ic-check"); solvedSet.add(i);
      } else {
        li.classList.add("worked-step--wrong");
        input.setAttribute("aria-invalid","true");
        mark.innerHTML=icon("ic-close");
      }
      return ok;
    }
    const checkBtn=stage.querySelector(".worked-check");
    function runCheck(){
      blankIdx.forEach(i=>{ if(!solvedSet.has(i) && !evalBlank(i)) everWrong=true; });
      const fb=$("#wfb");
      if(blankIdx.every(i=>solvedSet.has(i))){
        fb.className="feedback feedback--ok";
        fb.innerHTML=icon("ic-check")+`<div><b>Çözdün!</b> Tüm adımları doğru tamamladın.</div>`;
        checkBtn.disabled=true;
        if(!state.awarded.has(gk)){
          state.awarded.add(gk);
          addXP(D.rewards.xpPerCorrect+(everWrong?0:(D.rewards.firstTryBonus||0)));
          markMastered(); bumpStreak();
        }
        setNav({nextLabel: state.idx===segs.length-1?"Bitir":"Devam"});
      } else {
        fb.className="feedback feedback--no"; playSound("retry"); resetStreak();
        fb.innerHTML=icon("ic-close")+`<div><b>Neredeyse.</b> İşaretli adımları tekrar dene.</div>`;
      }
    }
    checkBtn.addEventListener("click", runCheck);
    stage.querySelectorAll(".worked-input").forEach(inp=>{
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); runCheck(); } });
    });
  }

  /* ---- summary + Carbon data-viz donut ---- */
  function donutSvg(pct,color){
    const r=64, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(100,pct))/100);
    return `<svg width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Ustalık ${pct} yüzde">
      <circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--cds-layer-accent-01)" stroke-width="14"/>
      <circle cx="80" cy="80" r="${r}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>`;
  }
  /* ---- tema-duyarlı SVG figür + grafik araçları ---- */
  function vizId(){ return "v"+Math.random().toString(36).slice(2,8); }
  function svgFigure(inner, caption){
    return `<figure class="viz">${inner}${caption?`<figcaption>${esc(caption)}</figcaption>`:""}</figure>`;
  }
  // Çubuk/çizgi grafik — viewBox responsive, currentColor/--viz-* ile tema-duyarlı,
  // role="img" + <title>/<desc> ile erişilebilir, animasyonsuz (sakin).
  function vizChart(spec){
    const id=vizId(), tid=id+"t", did=id+"d";
    const data=spec.data||[];
    const W=480,H=260,PADL=46,PADB=42,PADT=16,PADR=14;
    const plotW=W-PADL-PADR, plotH=H-PADT-PADB;
    const max=spec.max||Math.max(1,...data.map(p=>+p.value||0));
    let grid="",ticks=4;
    for(let i=0;i<=ticks;i++){ const gy=PADT+plotH*i/ticks, val=max*(1-i/ticks);
      grid+=`<line class="viz-grid" x1="${PADL}" y1="${gy.toFixed(1)}" x2="${W-PADR}" y2="${gy.toFixed(1)}" stroke-width="1"/>`
        +`<text class="viz-muted" x="${PADL-8}" y="${(gy+4).toFixed(1)}" text-anchor="end" font-size="11">${Math.round(val)}</text>`; }
    const axis=`<line class="viz-axis" x1="${PADL}" y1="${PADT}" x2="${PADL}" y2="${PADT+plotH}" stroke-width="1.5"/>`
      +`<line class="viz-axis" x1="${PADL}" y1="${PADT+plotH}" x2="${W-PADR}" y2="${PADT+plotH}" stroke-width="1.5"/>`;
    const n=data.length, step=plotW/Math.max(1,n);
    let body;
    if(spec.kind==="line"){
      const pts=data.map((p,i)=>[PADL+step*(i+0.5), PADT+plotH*(1-(+p.value||0)/max)]);
      const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
      body=grid+axis+`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`
        +pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--accent)"/>`).join("")
        +data.map((p,i)=>`<text class="viz-muted" x="${(PADL+step*(i+0.5)).toFixed(1)}" y="${H-PADB+18}" text-anchor="middle" font-size="11">${esc(p.label||"")}</text>`).join("");
    } else {
      const bw=Math.min(52, step*0.62);
      body=grid+axis+data.map((p,i)=>{
        const cx=PADL+step*(i+0.5), bh=plotH*((+p.value||0)/max), by=PADT+plotH-bh, fill=p.color||"var(--accent)";
        return `<rect x="${(cx-bw/2).toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" rx="2" fill="${fill}"/>`
          +`<text class="viz-muted" x="${cx.toFixed(1)}" y="${H-PADB+18}" text-anchor="middle" font-size="11">${esc(p.label||"")}</text>`;
      }).join("");
    }
    const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${tid} ${did}"><title id="${tid}">${esc(spec.title||"Grafik")}</title><desc id="${did}">${esc(spec.desc||spec.title||"")}</desc>${body}</svg>`;
    let legend="";
    if(spec.legend && data.some(p=>p.color)){
      legend=`<div class="viz-legend">`+data.map(p=>`<span><i style="background:${p.color||"var(--accent)"}"></i>${esc(p.label||"")}</span>`).join("")+`</div>`;
    }
    return svgFigure(svg+legend, spec.caption);
  }

  function renderChart(stage,s){
    let html=segHead(s, s.kicker||"Grafik")+instr(s);
    if(s.prompt) html+=`<p class="lead">${s.prompt}</p>`;

    if(s.takeaway) html+=`<div class="callout">${icon("ic-info")}<div>${s.takeaway}</div></div>`;
    stage.innerHTML=html;
    setNav({nextLabel: state.idx===segs.length-1?"Bitir":"Devam"});
  }

  /* ---- matematik dizgisi (hafif, bağımlılıksız) ---- */
  function mathExpr(src){
    let t=esc(String(src));
    t=t.replace(/\\?sqrt\s*\{([^{}]*)\}/g,'√<span class="rad">$1</span>')
       .replace(/\\?sqrt\s*\(([^()]*)\)/g,'√<span class="rad">$1</span>');
    t=t.replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g,'<span class="frac"><span class="num">$1</span><span class="den">$2</span></span>')
       .replace(/\{([^{}]*)\}\s*\/\s*\{([^{}]*)\}/g,'<span class="frac"><span class="num">$1</span><span class="den">$2</span></span>');
    t=t.replace(/\^\{([^{}]*)\}/g,"<sup>$1</sup>").replace(/\^(-?\d+(?:\.\d+)?|[A-Za-z])/g,"<sup>$1</sup>");
    t=t.replace(/_\{([^{}]*)\}/g,"<sub>$1</sub>").replace(/_(-?\d+(?:\.\d+)?|[A-Za-z])/g,"<sub>$1</sub>");
    t=t.replace(/&lt;=/g,"≤").replace(/&gt;=/g,"≥").replace(/!=/g,"≠").replace(/\+\/-/g,"±")
       .replace(/\*/g,"×").replace(/(\s)-(\s)/g,"$1−$2");
    t=t.replace(/\s([+\u2212\u00d7\u00f7=\u2264\u2265\u2260\u00b1])\s/g,' <span class="op">$1</span> ');
    return t;
  }
  function mathFigure(expr, caption){
    return `<figure class="viz"><p class="math block">${mathExpr(expr)}</p>${caption?`<figcaption>${esc(caption)}</figcaption>`:""}</figure>`;
  }
  /* ---- native MathML (ileri notasyon: matris/entegral/çok satırlı; sıfır JS/font/payload) ----
     Task 16: mathExpr() VARSAYILAN kalır — bu yalnız mathExpr'in yetersiz kaldığı ileri
     notasyonlar için tamamlayıcı bir figür sarmalayıcıdır (content-enrichment.md §2.3).
     Motor <math>…</math>'i SANITIZE ETMEZ/İŞLEMEZ: `body` zaten yazar-güvenilir ham HTML
     olarak innerHTML'e yazılır (interaction-patterns.md §1 "sade HTML"), bu yüzden inline
     <math> body dizeleri içine doğrudan yazılabilir — bu sarmalayıcı yalnız isteğe bağlı
     blok-figür/caption tutarlılığı için var (svgFigure ile aynı jenerik desen). Yazarlar
     MathML'i yalnız yapısal etiketlerle kullanmalı — olay-tutucu (on*) veya href/xlink:href
     EKLEMEMELİDİR (sanitizer olmadığından bu disiplin yazar sorumluluğundadır; yeni XSS
     yüzeyi açmamak için). */
  function mathmlFigure(mathml, caption){
    return svgFigure(mathml, caption);
  }

  /* ---- sayı doğrusu (tema-duyarlı, erişilebilir) ----
     v3.0.0 — Task 19: OPSİYONEL `interactive:true` dalı (numberline/geometri şeması
     genişlemesi). Bayrak yoksa (varsayılan/eski tüm çağrılar) `handle`/`readout`/
     `nlAttrs` boş dizge kalır ve üretilen SVG/figür BYTE-İÇİN-BYTE eskisiyle
     aynıdır — geriye-uyum burada "davranışça benzer" değil harfiyen aynı çıktı
     anlamına gelir (aşağıdaki her ekleme tek bir `if(spec.interactive)` bloğunun
     İÇİNDE, gövdenin geri kalanına dokunulmadan). Sürüklenebilir/klavye-adımlı
     noktanın DOM bağlama (keydown/pointer) tarafı burada YOK — numberLine saf bir
     dizge kurucudur (motorun geneli "body sade HTML" ilkesi); olay bağlama
     renderNumberline'da stage.innerHTML atamasından SONRA yapılır (sim/conceptMap
     ile aynı desen: querySelector + addEventListener stage üzerinde). */
  /* NL_W/NL_PADX: numberLine'ın SVG genişliği ve yatay dolgusu — tek kaynak.
     wireNumberlineInteractive de AYNI X(v) ölçeğini (piksel<->değer) yeniden
     kurmak zorunda (statik SVG'ye SONRADAN olay bağlıyor, bkz. yukarıdaki not);
     iki fonksiyon aynı sabitleri BURADAN okur, böylece biri değişirse diğeri
     sessizce kaymaz (480/28 değişmeden kalmalı — regresyon testine bkz.). */
  const NL_W=480, NL_PADX=28;
  function numberLine(spec){
    const min=spec.min!=null?spec.min:0, max=spec.max!=null?spec.max:10;
    const step=spec.step||1, id=vizId(), tid=id+"t", did=id+"d";
    const W=NL_W,H=110,PADX=NL_PADX,Y=64, plotW=W-2*PADX, span=(max-min)||1;
    const X=v=>PADX+plotW*((v-min)/span);
    let ticks="";
    for(let v=min; v<=max+1e-9; v=+(v+step).toFixed(6)){
      const x=X(v);
      ticks+=`<line class="viz-axis" x1="${x.toFixed(1)}" y1="${Y-6}" x2="${x.toFixed(1)}" y2="${Y+6}" stroke-width="1.5"/>`
        +`<text class="viz-muted" x="${x.toFixed(1)}" y="${Y+26}" text-anchor="middle" font-size="12">${(+v.toFixed(6))}</text>`;
    }
    let hi="";
    if(spec.highlight && spec.highlight.length===2){
      const a=X(spec.highlight[0]), b=X(spec.highlight[1]);
      hi=`<rect x="${Math.min(a,b).toFixed(1)}" y="${Y-5}" width="${Math.abs(b-a).toFixed(1)}" height="10" rx="3" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.5"/>`;
    }
    const axis=`<line class="viz-axis" x1="${PADX}" y1="${Y}" x2="${W-PADX}" y2="${Y}" stroke-width="2" marker-end="url(#vz-arrow)"/>`;
    const pts=(spec.points||[]).map(p=>{
      const x=X(p.value), c=p.color||"var(--accent)";
      return `<circle cx="${x.toFixed(1)}" cy="${Y}" r="6" fill="${c}"/>`
        +(p.label?`<text x="${x.toFixed(1)}" y="${Y-14}" text-anchor="middle" font-size="12" font-weight="600">${esc(p.label)}</text>`:"");
    }).join("");
    let handle="", readout="", nlAttrs="";
    if(spec.interactive){
      const hid=id+"h";
      const rawInit = numOr(spec.value, (min+max)/2);
      const initVal = clampNum(+(Math.round(rawInit/step)*step).toFixed(6), min, max);
      const label = esc(spec.interactiveLabel || spec.label || "Değer");
      const hx = X(initVal);
      nlAttrs = ` data-nl-handle="${hid}" data-nl-min="${min}" data-nl-max="${max}" data-nl-step="${step}"`;
      handle = `<circle class="nl-handle" id="${hid}" cx="${hx.toFixed(1)}" cy="${Y}" r="9" tabindex="0" `
        + `role="slider" aria-orientation="horizontal" aria-valuemin="${min}" aria-valuemax="${max}" aria-valuenow="${initVal}" aria-label="${label}"/>`;
      readout = `<div class="nl-readout" id="${hid}out">${label}: <span class="nl-readout__val">${initVal}</span></div>`;
    }
    const svg=`<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${tid} ${did}"${nlAttrs}><title id="${tid}">${esc(spec.title||"Sayı doğrusu")}</title><desc id="${did}">${esc(spec.desc||spec.title||"")}</desc>${hi}${axis}${ticks}${pts}${handle}</svg>`;
    return svgFigure(svg, spec.caption) + readout;
  }
  /* ---- sayı doğrusu: interactive el bağlama (Task 19) ----
     numberLine(spec) `spec.interactive` iken bir `<circle class="nl-handle"
     role="slider" tabindex="0">` + dıştaki svg'ye `data-nl-handle/min/max/step`
     öznitelikleri + görünür bir aria-live okuma satırı üretir; bu fonksiyon
     stage.innerHTML atamasından SONRA çağrılır (renderNumberline) ve o statik
     iskeleye olay dinleyicisi TAKAR — hiçbir yeni DOM düğümü kurmaz. KLAVYE
     ZORUNLU/BİRİNCİL yol: ArrowLeft/ArrowRight step kadar, Home/End min/max'a
     atlar (ok-tuşu = match/conceptMap'teki "gerçek etkileşimli öğe" ilkesiyle
     aynı ruh, burada native click yerine native olmayan bir role="slider" olduğu
     için keydown ELLE yazılmak ZORUNDA — <input type=range> gibi tarayıcı-yerli
     ok-tuşu davranışı YOK). Pointer sürükle YALNIZ isteğe bağlı bir zenginleştirme
     (WCAG 2.1 AA: sürükle asla TEK yol olamaz — burada değil, klavye birincil ve
     tam işlevsel). reduceMotion() altında handle.style.transition="none" ile
     anında konumlanır (CSS tarafında da .nl-handle geçişi yalnızca
     prefers-reduced-motion:no-preference altında tanımlı — çift-katmanlı garanti,
     bkz. CSS bloğu). */
  function wireNumberlineInteractive(stage, spec){
    const svg = stage.querySelector("svg.viz[data-nl-handle]");
    if(!svg) return;
    const handle = svg.querySelector(".nl-handle");
    if(!handle) return;
    if(reduceMotion()) handle.style.transition = "none";
    const readoutVal = stage.querySelector("#"+handle.id+"out .nl-readout__val");
    const min = numOr(svg.getAttribute("data-nl-min"), 0);
    const max = numOr(svg.getAttribute("data-nl-max"), 10);
    const step = numOr(svg.getAttribute("data-nl-step"), 1) || 1;
    const W=NL_W,PADX=NL_PADX,plotW=W-2*PADX, span=(max-min)||1;
    const X=v=>PADX+plotW*((v-min)/span);
    let val = numOr(handle.getAttribute("aria-valuenow"), (min+max)/2);
    function place(v){
      val = clampNum(+(Math.round(v/step)*step).toFixed(6), min, max);
      handle.setAttribute("cx", X(val).toFixed(1));
      handle.setAttribute("aria-valuenow", String(val));
      if(readoutVal) readoutVal.textContent = String(val);
    }
    handle.addEventListener("keydown", e=>{
      let nv;
      if(e.key==="ArrowRight"||e.key==="ArrowUp") nv=val+step;
      else if(e.key==="ArrowLeft"||e.key==="ArrowDown") nv=val-step;
      else if(e.key==="Home") nv=min;
      else if(e.key==="End") nv=max;
      else return;
      e.preventDefault();
      place(nv);
    });
    // pointer sürükle: opsiyonel zenginleştirme, klavye yolunun YERİNE değil yanında
    let dragging=false;
    function valFromClientX(clientX){
      const rect = svg.getBoundingClientRect();
      const scale = rect.width ? (W/rect.width) : 1;
      const svgX = (clientX-rect.left)*scale;
      const t = clampNum((svgX-PADX)/plotW, 0, 1);
      return min + t*span;
    }
    handle.addEventListener("pointerdown", e=>{
      dragging=true; handle.focus();
      if(handle.setPointerCapture) handle.setPointerCapture(e.pointerId);
    });
    handle.addEventListener("pointermove", e=>{ if(dragging) place(valFromClientX(e.clientX)); });
    handle.addEventListener("pointerup", ()=>{ dragging=false; });
    handle.addEventListener("pointercancel", ()=>{ dragging=false; });
  }

  /* ---- Carbon DataTable (anlamsal tablo) ---- */
  function vizTable(spec){
    const cols=spec.columns||[];
    const rowHeader=!!spec.rowHeader;
    const hi=new Set(spec.highlightRows||[]);
    const thead=`<thead><tr>${cols.map(c=>`<th scope="col"${c.numeric?' class="num"':""}>${esc(c.label!=null?c.label:c)}</th>`).join("")}</tr></thead>`;
    const body=(spec.rows||[]).map((row,ri)=>{
      const cells=Array.isArray(row)?row:cols.map(c=>row[c.key]);
      const tds=cells.map((val,ci)=>{
        const c=cols[ci]||{}; const cls=(c.numeric?"num ":"")+(hi.has(ri)?"hi":"");
        if(ci===0 && rowHeader) return `<th scope="row"${cls?` class="${cls.trim()}"`:""}>${esc(val)}</th>`;
        return `<td${cls.trim()?` class="${cls.trim()}"`:""}>${esc(val)}</td>`;
      }).join("");
      return `<tr>${tds}</tr>`;
    }).join("");
    return `<div class="viz-table-wrap"><table class="viz-table">${spec.caption?`<caption>${esc(spec.caption)}</caption>`:""}${thead}<tbody>${body}</tbody></table></div>`;
  }

  function renderTable(stage,s){
    let html=segHead(s, s.kicker||"Tablo")+instr(s);
    if(s.prompt) html+=`<p class="lead">${s.prompt}</p>`;
    html+=vizTable(s.table||s);
    if(s.takeaway) html+=`<div class="callout">${icon("ic-info")}<div>${s.takeaway}</div></div>`;
    stage.innerHTML=html;
    setNav({nextLabel: state.idx===segs.length-1?"Bitir":"Devam"});
  }
  function renderNumberline(stage,s){
    const nlSpec = s.numberline||s;
    let html=segHead(s, s.kicker||"Sayı Doğrusu")+instr(s);
    if(s.prompt) html+=`<p class="lead">${s.prompt}</p>`;
    html+=numberLine(nlSpec);
    if(s.takeaway) html+=`<div class="callout">${icon("ic-info")}<div>${s.takeaway}</div></div>`;
    stage.innerHTML=html;
    if(nlSpec.interactive) wireNumberlineInteractive(stage, nlSpec);
    setNav({nextLabel: state.idx===segs.length-1?"Bitir":"Devam"});
  }

  /* ---- sim: parametrik simülasyon (sanal manipülatif; Task 17) ----
     gamified-flows.md §5.3/§5.3.1 kod-güvenli tasarım kararı: MODULE_DATA yalnız
     VERİ taşır (simType + params[]) — motor olayları bağlar/render eder ilkesi
     (module-architecture.md §2: "body sade HTML; motor olayları bağlar"). Bu
     yüzden `sim` keyfi bir render fonksiyonu TAŞIMAZ; SIM_PRESETS ENGINE-sabit
     bir preset kütüphanesidir — MODULE_DATA yalnız hangi preset'in (simType)
     hangi parametrelerle (params[]) çağrılacağını seçer, asla kod/fonksiyon
     taşımaz. Yeni bir preset eklemek = motor genişletmesi (yeni SIM_PRESETS dalı
     + G-SVG erişilebilirliği), MODULE_DATA yeteneği DEĞİL.
     Her preset (svg,v,labels)=>{ svg.innerHTML = "…" } imzasındadır: `v` o anki
     kaydırıcı değerleri (params[].key → sayı), `labels` segmentin opsiyonel
     `labels` alanı (yalnız `labels.title` ile SVG başlığını override eder — yoksa
     preset kendi Türkçe açıklamasını üretir). Presetler svg.innerHTML'i TAMAMEN
     değiştirir (kısmi öznitelik ayarı değil) — bu yüzden CSS transition/animasyon
     YOKTUR ve yeniden çizim reduced-motion altında da üstünde de mimari olarak
     ANINDADIR (eski düğümler yok edilip yenileri kuruluyor; ara-kare
     interpolasyonu mümkün değil — bkz. .sim-* CSS yorumu). Her preset kendi
     simSvgTitle (+ simSvgDesc) başlık/betimini yeniden yazar; dıştaki svg öğesi
     (aria-labelledby=simSvgTitle+simSvgDesc) her redraw'da aynı sabit id'lere
     işaret eder (sim segmenti aynı anda tek örnek olduğundan
     vizId() gerekmez — #seModel/#pacingDisk deseniyle aynı ilke). Fiziksel
     formüller (projectile/wave/functionPlot) kendi doğal aralığına göre SVG
     çerçevesine OTOMATİK ölçeklenir — yazarın params[].min/max seçimi ne olursa
     olsun taşma riski yok; pendulum/numberScale kırpma (clampNum) ile korunur. */
  function numOr(x,fallback){ const n=+x; return isFinite(n)?n:fallback; }
  function clampNum(x,lo,hi){ return Math.max(lo,Math.min(hi,x)); }
  const SIM_PRESETS = {
    // Sarkaç: uzunluk (+ opsiyonel açı) → pivot + kol + top. Gerçek-zamanlı
    // fizik ANİMASYONU değil — seçilen değerlerdeki DURAĞAN konumu gösterir
    // (ör. "daha uzun sarkaç" karşılaştırması).
    pendulum: (svg, v, labels) => {
      const Lm = clampNum(numOr(v.length, 1), 0.2, 2.2);
      const hasAngle = v.angle != null;
      const rawAngle = numOr(v.angle, 20);
      const A = clampNum(rawAngle, -75, 75);
      const pivotX = 240, pivotY = 26, pxPerM = 72;
      const Lpx = Lm * pxPerM;
      const rad = A * Math.PI / 180;
      const bobX = pivotX + Lpx * Math.sin(rad);
      const bobY = pivotY + Lpx * Math.cos(rad);
      const title = (labels && labels.title) ? esc(labels.title)
        : "Sarkaç: uzunluk " + Lm.toFixed(2) + " m" + (hasAngle ? ", açı " + Math.round(rawAngle) + "°" : "");
      svg.innerHTML = `<title id="simSvgTitle">${title}</title>
        <desc id="simSvgDesc">Kaydırıcıyı hareket ettirerek sarkacın ${hasAngle?"uzunluğunu ve açısını":"uzunluğunu"} değiştir.</desc>
        <line x1="${pivotX}" y1="${pivotY}" x2="${pivotX}" y2="${(pivotY+Lpx).toFixed(1)}" class="viz-axis" stroke-width="1.5" stroke-dasharray="3 5"/>
        <line x1="${pivotX}" y1="${pivotY}" x2="${bobX.toFixed(1)}" y2="${bobY.toFixed(1)}" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="${pivotX}" cy="${pivotY}" r="5" fill="var(--viz-axis)"/>
        <circle cx="${bobX.toFixed(1)}" cy="${bobY.toFixed(1)}" r="14" fill="var(--accent)"/>
        <text class="viz-muted" x="${pivotX}" y="16" text-anchor="middle" font-size="12">Sabit nokta</text>
        <text x="${bobX.toFixed(1)}" y="${(bobY+26).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="600">L = ${Lm.toFixed(2)} m</text>`;
    },
    // Mermi hareketi: hız + açı → yörünge yayı (klasik parabolik hareket formülü;
    // menzil/yükseklik SVG çerçevesine otomatik ölçeklenir).
    projectile: (svg, v, labels) => {
      const v0 = clampNum(numOr(v.speed, 20), 1, 60);
      const angDeg = clampNum(numOr(v.angle, 45), 1, 89);
      const g = 9.8, rad = angDeg * Math.PI / 180;
      const R = Math.max(0.01, (v0*v0*Math.sin(2*rad))/g);
      const W=480,H=240,PADL=30,PADR=20,PADT=20,PADB=32;
      const plotW=W-PADL-PADR, plotH=H-PADT-PADB;
      const N=40, hMax = (v0*v0*Math.pow(Math.sin(rad),2))/(2*g) || 0.01;
      let d="";
      for(let i=0;i<=N;i++){
        const x = R*i/N;
        let y = x*Math.tan(rad) - (g*x*x)/(2*v0*v0*Math.pow(Math.cos(rad),2));
        if(y<0) y=0;
        const px = PADL + plotW*(x/R);
        const py = PADT + plotH*(1-(y/hMax));
        d += (i?"L":"M")+px.toFixed(1)+" "+py.toFixed(1)+" ";
      }
      const groundY = PADT+plotH;
      const title = (labels && labels.title) ? esc(labels.title)
        : "Mermi hareketi: hız " + v0 + " m/sn, açı " + angDeg + "°, menzil " + R.toFixed(1) + " m";
      svg.innerHTML = `<title id="simSvgTitle">${title}</title>
        <desc id="simSvgDesc">Hız ve açı kaydırıcılarını değiştirerek menzilin nasıl değiştiğini gör.</desc>
        <line x1="${PADL}" y1="${groundY}" x2="${W-PADR}" y2="${groundY}" class="viz-axis" stroke-width="1.5"/>
        <path d="${d.trim()}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#vz-arrow)"/>
        <text class="viz-muted" x="${W/2}" y="${H-8}" text-anchor="middle" font-size="12">menzil ≈ ${R.toFixed(1)} m</text>`;
    },
    // Dalga: genlik + frekans → sinüs eğrisi (sabit pencere üzerinde örneklenir).
    wave: (svg, v, labels) => {
      const amp = clampNum(numOr(v.amplitude, 40), 2, 100);
      const freq = clampNum(numOr(v.frequency, 1.5), 0.2, 6);
      const W=480,H=240,PADL=20,PADR=20, midY=H/2, plotW=W-PADL-PADR, N=80;
      let d="";
      for(let i=0;i<=N;i++){
        const t=i/N, x=PADL+plotW*t, y=midY-amp*Math.sin(2*Math.PI*freq*t);
        d += (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1)+" ";
      }
      const title = (labels && labels.title) ? esc(labels.title)
        : "Dalga: genlik " + amp.toFixed(0) + ", frekans " + freq.toFixed(1);
      svg.innerHTML = `<title id="simSvgTitle">${title}</title>
        <desc id="simSvgDesc">Genlik ve frekans kaydırıcılarını değiştirerek dalga şeklinin nasıl değiştiğini gör.</desc>
        <line x1="${PADL}" y1="${midY}" x2="${W-PADR}" y2="${midY}" class="viz-axis" stroke-width="1.5" stroke-dasharray="3 5"/>
        <path d="${d.trim()}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    },
    // Sayı doğrusu / ölçek: tek değer → eksen üzerinde işaretli nokta; eksen
    // alanı değer 0-10'un dışına taşarsa otomatik genişler.
    numberScale: (svg, v, labels) => {
      const val = numOr(v.value, 5);
      const hi = Math.max(10, Math.ceil(val)+1);
      const lo = Math.min(0, Math.floor(val)-1);
      const W=480,H=240,PADX=30,Y=H/2,plotW=W-2*PADX, span=(hi-lo)||1;
      const stepTick = Math.max(1, Math.ceil((hi-lo)/10));
      const X = x => PADX+plotW*((x-lo)/span);
      let ticks="";
      for(let t=lo; t<=hi+1e-9; t+=stepTick){
        const x=X(t);
        ticks += `<line class="viz-axis" x1="${x.toFixed(1)}" y1="${Y-6}" x2="${x.toFixed(1)}" y2="${Y+6}" stroke-width="1.5"/>`
          + `<text class="viz-muted" x="${x.toFixed(1)}" y="${Y+24}" text-anchor="middle" font-size="12">${Math.round(t)}</text>`;
      }
      const px=X(val);
      const title = (labels && labels.title) ? esc(labels.title) : "Sayı doğrusu: değer " + val;
      svg.innerHTML = `<title id="simSvgTitle">${title}</title>
        <desc id="simSvgDesc">Kaydırıcıyı hareket ettirerek sayı doğrusundaki noktayı değiştir.</desc>
        <line x1="${PADX}" y1="${Y}" x2="${W-PADX}" y2="${Y}" class="viz-axis" stroke-width="2" marker-end="url(#vz-arrow)"/>
        ${ticks}
        <circle cx="${px.toFixed(1)}" cy="${Y}" r="7" fill="var(--accent)"/>
        <text x="${px.toFixed(1)}" y="${Y-16}" text-anchor="middle" font-size="13" font-weight="600">${val}</text>`;
    },
    // Fonksiyon grafiği: eğim (m) + kesişim (b) → y = mx + b doğrusu, sabit x
    // eksenine (-5..5) göre çizilir; eksenler her zaman orijinden geçer.
    functionPlot: (svg, v, labels) => {
      const m = clampNum(numOr(v.m, 1), -20, 20);
      const b = clampNum(numOr(v.b, 0), -20, 20);
      const xMin=-5, xMax=5;
      const y1=m*xMin+b, y2=m*xMax+b;
      let yLo=Math.min(y1,y2,0), yHi=Math.max(y1,y2,0);
      if(yHi-yLo<1){ yHi+=1; yLo-=1; }
      const W=480,H=240,PADL=34,PADR=20,PADT=20,PADB=30;
      const plotW=W-PADL-PADR, plotH=H-PADT-PADB;
      const X = x => PADL+plotW*((x-xMin)/(xMax-xMin));
      const Y = y => PADT+plotH*(1-((y-yLo)/(yHi-yLo)));
      const x0=X(0), y0=Y(0);
      const d = `M${X(xMin).toFixed(1)} ${Y(y1).toFixed(1)} L${X(xMax).toFixed(1)} ${Y(y2).toFixed(1)}`;
      const title = (labels && labels.title) ? esc(labels.title) : "Fonksiyon grafiği: y = " + m + "x + " + b;
      svg.innerHTML = `<title id="simSvgTitle">${title}</title>
        <desc id="simSvgDesc">Eğim (m) ve kesişim (b) kaydırıcılarını değiştirerek doğrunun nasıl hareket ettiğini gör.</desc>
        <line x1="${PADL}" y1="${y0.toFixed(1)}" x2="${W-PADR}" y2="${y0.toFixed(1)}" class="viz-axis" stroke-width="1.5"/>
        <line x1="${x0.toFixed(1)}" y1="${PADT}" x2="${x0.toFixed(1)}" y2="${H-PADB}" class="viz-axis" stroke-width="1.5"/>
        <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="${x0.toFixed(1)}" cy="${y0.toFixed(1)}" r="5" fill="var(--viz-2)"/>`;
    }
  };

  /* ---- sim segmenti: renderSim(stage,s) ----
     Şema: {type:"sim", id, title?, instructions?, simType, params:[{key,min,max,
     step,default,label}], labels?}. Kaydırıcı klavye-erişilebilirliği YERLEŞİKTİR
     (native input type=range: ok tuşları step kadar değiştirir, Home/End
     min/max'a atlar) — ayrı bir klavye-işleyici yazılmadı/gerekmiyor. Segment
     KEŞFEDİCİDİR/puanlanmaz: setNav next hep etkin, addXP/markMastered/
     bumpStreak YOK, totalGradeable paydasına katkısı yok (selfExplain'le aynı
     ilke — bkz. yukarıdaki totalGradeable reduce, "sim" orada yok). */
  function renderSim(stage,s){
    const params = s.params||[];
    const preset = (Object.prototype.hasOwnProperty.call(SIM_PRESETS, s.simType) && typeof SIM_PRESETS[s.simType]==="function") ? SIM_PRESETS[s.simType] : null;
    let html = segHead(s,"Simülasyon") + instr(s);
    html += ttsRow(stripTags(s.instructions||s.title||""), defLang());
    if(!preset){
      // Bilinmeyen simType: nazik/uydurmasız not — kaydırıcı/SVG hiç render edilmez, çökme yok.
      html += `<div class="feedback feedback--info">${icon("ic-info")}<div>`
        + `<b>Bu simülasyon için hazır şablon yok.</b> İstenen tür: «${esc(s.simType||"(belirtilmemiş)")}». `
        + `Motorda tanımlı presetler: ${Object.keys(SIM_PRESETS).join(", ")}.</div></div>`;
      stage.innerHTML = html;
      setNav({nextLabel: state.idx===segs.length-1?"Bitir":"Devam"});
      return;
    }
    html += `<div class="sim-controls" role="group" aria-label="Simülasyon kontrolleri">`;
    params.forEach((p,i)=>{
      const id = "simRange"+i;
      const min = p.min!=null?p.min:0, max = p.max!=null?p.max:100, step = p.step||1;
      const def = p.default!=null?p.default:min;
      const label = p.label||p.key||("Değer "+(i+1));
      html += `<div class="sim-param">`
        + `<span class="sim-param__lbl" id="${id}Lbl">${esc(label)}</span>`
        + `<input type="range" id="${id}" data-key="${esc(String(p.key||i))}" min="${min}" max="${max}" step="${step}" value="${def}" aria-label="${esc(label)}">`
        + `<output class="sim-val" for="${id}">${def}</output>`
        + `</div>`;
    });
    html += `</div>`;
    html += `<div class="visual sim-canvas"><svg class="viz" id="simSvg" viewBox="0 0 480 240" role="img" aria-labelledby="simSvgTitle simSvgDesc"><title id="simSvgTitle">${esc(s.title||"Simülasyon")}</title><desc id="simSvgDesc">Kaydırıcıları hareket ettirerek görseli değiştir.</desc></svg></div>`;
    stage.innerHTML = html;

    const svgEl = stage.querySelector("#simSvg");
    const sliders = Array.from(stage.querySelectorAll(".sim-param input[type=range]"));
    function currentValues(){
      const v={};
      sliders.forEach(inp=>{ v[inp.dataset.key]=parseFloat(inp.value); });
      return v;
    }
    function redraw(){
      // svg.innerHTML TAM değişim: reduced-motion'dan bağımsız her zaman ANINDA
      // (CSS transition/animasyon tanımlanmadı — eski düğümler her redraw'da yok
      // edilip yenileri kuruluyor, ara-kare interpolasyonu mimari olarak yok).
      try{ preset(svgEl, currentValues(), s.labels||{}); }
      catch(e){ /* preset hata verirse canvas son geçerli kareyi korur — çökme yok */ }
    }
    sliders.forEach(inp=>{
      const out = inp.parentElement.querySelector(".sim-val");
      inp.addEventListener("input", ()=>{ if(out) out.textContent = inp.value; redraw(); });
    });
    redraw(); // ilk kare
    setNav({nextLabel: state.idx===segs.length-1?"Bitir":"Devam"}); // keşfedici — sonraki hep etkin
  }

  /* ---- conceptMap: kavram haritası kurucu (Task 18) ----
     Şema: {type:"conceptMap", id, title?, instructions?, nodes:[{id,label}]
     (en az 2), targetEdges:[[nodeIdA,nodeIdB],...]}. KLAVYE YOLU ZORUNLU ve
     bu sürümde TEK yoldur (sürükle-bırak eklenmedi — WCAG 2.1 AA gereği pointer
     sürükle yalnız opsiyonel bir zenginleştirme OLABİLİR, hiçbir zaman tek yol
     olamaz; burada hiç eklenmediği için sorun yok). Her düğüm gerçek bir
     <button aria-label> — match/order'ın "gerçek buton = klavye bedava" ilkesi:
     Enter/Space native olarak "click" üretir, ayrı bir keydown işleyici gerekmez.
     Akış: kaynak-düğüm seç (tıkla/Enter/Space) → farklı bir hedef-düğüm seç
     (tıkla/Enter/Space) → aralarında bir kenar kurulur; aynı düğüme ikinci kez
     basmak seçimi iptal eder (match'in iki-sabit-sütun modelinden farklı olarak
     burada her düğüm hem kaynak hem hedef rolü alabildiğinden bu iptal yolu
     gerekli bir kaçış kapısıdır). Kurulan kenarlar hem SVG çizgi katmanında
     (yalnız GÖRSEL — aria-hidden; erişilebilir kayıt aşağıdaki metin listesidir,
     çift-temsil karmaşası yaratmamak için) hem de #cmapEdgeList metin listesinde
     gösterilir — her satır klavye-erişilebilir bir "kaldır" düğmesi taşır.
     "Kontrol et" öğrencinin kenarlarını targetEdges'e karşı SIRASIZ karşılaştırır
     ([A,B]===[B,A]); doğru kenar yeşil+onay ikonu, hedef-dışı ("fazla") kenar
     nötr bilgi rengi, eksik hedef kenar nazikçe (cezasız) listelenir — öğrenci
     listeden düzenleyip tekrar kontrol edebilir. TAM eşleşince (eksiksiz VE
     fazlasız) addXP+markMastered TEK SEFERDE tetiklenir — brief'in "tümü doğru
     → addXP+markMastered" tekil-olay tarifi, worked'in runCheck desenidir
     (match/order'ın kenar-başına ödülü DEĞİL). totalGradeable'a katkısı da
     worked'in fadeFrom-boş-korumasıyla birebir aynı ilke: gerçek bir targetEdges
     varsa +1, yoksa +0 (bkz. yukarıdaki totalGradeable reduce) — bu yüzden gk=s.id
     (worked ile birebir aynı, alt-öğe başına değil). En az 2 düğüm veya boş
     targetEdges → nazik/uydurmasız bir bilgi notu (sim'in bilinmeyen-simType
     dalıyla aynı desen), çökme yok. */
  function renderConceptMap(stage,s){
    const nodes = s.nodes||[];
    const targets = (s.targetEdges||[]).map(e=>[String(e[0]),String(e[1])]);
    let html = segHead(s,"Kavram Haritası") + instr(s);
    html += ttsRow(stripTags(s.instructions||s.title||""), defLang());
    if(nodes.length<2 || !targets.length){
      html += `<div class="feedback feedback--info">${icon("ic-info")}<div>`
        + `<b>Bu kavram haritası için yeterli veri yok.</b> En az 2 düğüm ve 1 hedef bağlantı gerekir.</div></div>`;
      stage.innerHTML = html;
      setNav({nextLabel: state.idx===segs.length-1?"Bitir":"Devam"});
      return;
    }
    // Düğümleri sabit bir elips üzerine dağıt (viewBox 0 0 600 400, oran 3:2 —
    // .cmap-field'ın CSS aspect-ratio:3/2'siyle kilitli, böylece yüzde-konum
    // her zaman aynı elipsi tarif eder). n>=2 burada garanti (yukarıdaki koruma).
    const W=600, H=400, cx0=W/2, cy0=H/2, rx=210, ry=130, n=nodes.length;
    const pos={};
    nodes.forEach((nd,i)=>{
      const ang = -Math.PI/2 + i*(2*Math.PI/n);
      pos[nd.id] = {x:cx0+rx*Math.cos(ang), y:cy0+ry*Math.sin(ang)};
    });
    function labelOf(id){ const nd=nodes.find(x=>String(x.id)===String(id)); return nd?nd.label:String(id); }
    function edgeEq(e1,e2){ return (e1[0]===e2[0]&&e1[1]===e2[1])||(e1[0]===e2[1]&&e1[1]===e2[0]); }
    function hasEdge(list,e){ return list.some(x=>edgeEq(x,e)); }

    html += `<div class="cmap-field" role="group" aria-label="Kavram düğümleri">`
      + `<svg class="cmap-lines" viewBox="0 0 ${W} ${H}" aria-hidden="true"></svg>`;
    nodes.forEach(nd=>{
      const p = pos[nd.id]||{x:cx0,y:cy0};
      html += `<button type="button" class="cmap-node" data-id="${esc(String(nd.id))}" `
        + `style="left:${(p.x/W*100).toFixed(2)}%;top:${(p.y/H*100).toFixed(2)}%" `
        + `aria-pressed="false" aria-label="${esc(nd.label)} — bağlantı için seç">${esc(nd.label)}</button>`;
    });
    html += `</div>`;
    html += `<div class="cmap-edges">`
      + `<h3 class="cmap-edges__lbl">Bağlantılarım</h3>`
      + `<p class="cmap-edges__empty" id="cmapEmpty">Henüz bağlantı yok. Bir düğüm seç, sonra bağlamak istediğin ikinci düğümü seç.</p>`
      + `<ul class="cmap-edges__list" id="cmapEdgeList"></ul>`
      + `</div>`;
    html += `<button type="button" class="btn btn--ghost cmap-check" id="cmapCheckBtn">${icon("ic-check")}<span>Kontrol et</span></button>`;
    html += `<div id="cmfb" aria-live="polite"></div>`;
    stage.innerHTML = html;
    setNav({next:false});

    const nodeButtons={};
    stage.querySelectorAll(".cmap-node").forEach(b=>{ nodeButtons[b.dataset.id]=b; });
    const svgLines = stage.querySelector(".cmap-lines");
    const listEl = stage.querySelector("#cmapEdgeList");
    const emptyEl = stage.querySelector("#cmapEmpty");
    const fb = stage.querySelector("#cmfb");
    const checkBtn = stage.querySelector("#cmapCheckBtn");
    const edges=[]; // öğrencinin kurduğu kenarlar: [nodeIdA,nodeIdB][]
    let selected=null, checked=false, everImperfect=false;
    const gk=s.id; // worked ile birebir aynı ilke: tekil/toplu grade-key, alt-öğe başına değil

    function redrawLines(){
      svgLines.innerHTML = edges.map(e=>{
        const p1=pos[e[0]], p2=pos[e[1]]; if(!p1||!p2) return "";
        let cls="cmap-line";
        if(checked) cls += hasEdge(targets,e) ? " cmap-line--correct" : " cmap-line--extra";
        return `<line x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}" class="${cls}"></line>`;
      }).join("");
    }
    function redrawList(){
      emptyEl.hidden = edges.length>0;
      listEl.innerHTML = edges.map((e,i)=>{
        let stateCls="", mark="";
        if(checked){
          if(hasEdge(targets,e)){ stateCls=" cmap-edge--correct"; mark=icon("ic-check"); }
          else { stateCls=" cmap-edge--extra"; mark=icon("ic-info"); }
        }
        const a=esc(labelOf(e[0])), b=esc(labelOf(e[1]));
        return `<li class="cmap-edge${stateCls}">`
          + `<span class="cmap-edge__mark">${mark}</span>`
          + `<span class="cmap-edge__text">${a} ↔ ${b}</span>`
          + `<button type="button" class="cmap-edge__remove" data-i="${i}" aria-label="${a} - ${b} bağlantısını kaldır">${icon("ic-close")}</button>`
          + `</li>`;
      }).join("");
      listEl.querySelectorAll(".cmap-edge__remove").forEach(rb=>{
        rb.addEventListener("click",()=>{
          if(rb.disabled) return;
          edges.splice(+rb.dataset.i,1);
          checked=false; fb.className=""; fb.innerHTML="";
          redrawLines(); redrawList();
        });
      });
    }
    function clearSelected(){
      if(selected && nodeButtons[selected]){
        nodeButtons[selected].setAttribute("aria-pressed","false");
        nodeButtons[selected].classList.remove("cmap-node--sel");
      }
      selected=null;
    }
    function lockComplete(){
      Object.keys(nodeButtons).forEach(id=>{ nodeButtons[id].disabled=true; });
      listEl.querySelectorAll(".cmap-edge__remove").forEach(rb=>{ rb.disabled=true; });
      checkBtn.disabled=true;
    }
    Object.keys(nodeButtons).forEach(id=>{
      nodeButtons[id].addEventListener("click", ()=>{
        if(nodeButtons[id].disabled) return;
        if(!selected){
          selected=id; nodeButtons[id].setAttribute("aria-pressed","true"); nodeButtons[id].classList.add("cmap-node--sel");
          return;
        }
        if(selected===id){ clearSelected(); return; }
        const newEdge=[selected,id];
        clearSelected();
        if(hasEdge(edges,newEdge)){
          fb.className="feedback feedback--info";
          fb.innerHTML=icon("ic-info")+`<div><b>Bu bağlantı zaten listende.</b> Aşağıdan kaldırabilirsin.</div>`;
          return;
        }
        edges.push(newEdge); checked=false;
        fb.className=""; fb.innerHTML="";
        redrawLines(); redrawList();
      });
    });
    checkBtn.addEventListener("click", ()=>{
      checked=true; redrawLines(); redrawList();
      const missing = targets.filter(t=>!hasEdge(edges,t));
      const extra = edges.filter(e=>!hasEdge(targets,e));
      if(!missing.length && !extra.length){
        fb.className="feedback feedback--ok";
        fb.innerHTML=icon("ic-check")+`<div><b>Kavram haritan doğru!</b> Tüm ilişkileri doğru kurdun.</div>`;
        lockComplete();
        if(!state.awarded.has(gk)){
          state.awarded.add(gk);
          addXP(D.rewards.xpPerCorrect+(everImperfect?0:(D.rewards.firstTryBonus||0)));
          markMastered(); bumpStreak();
        }
        setNav({nextLabel: state.idx===segs.length-1?"Bitir":"Devam"});
      } else {
        everImperfect=true;
        const bits=[];
        if(missing.length) bits.push("Henüz eklenmedi: "+missing.map(m=>esc(labelOf(m[0]))+" ↔ "+esc(labelOf(m[1]))).join(", ")+".");
        if(extra.length) bits.push("Hedef yapıda olmayan bağlantı(lar): "+extra.map(m=>esc(labelOf(m[0]))+" ↔ "+esc(labelOf(m[1]))).join(", ")+".");
        fb.className="feedback feedback--info"; playSound("retry"); resetStreak();
        fb.innerHTML=icon("ic-info")+`<div><b>Neredeyse!</b> ${bits.join(" ")} Listeden düzenleyip tekrar kontrol edebilirsin.</div>`;
      }
    });
  }

  /* ====== derse-özel görsel güçler ====== */
  // Ortak görüntüleme-segment fabrikası (kod tekrarını ve karmaşıklığı azaltır).
  function displaySeg(kicker, build){
    return function(stage,s){
      let html=segHead(s, s.kicker||kicker)+instr(s);
      if(s.prompt) html+=`<p class="lead">${s.prompt}</p>`;
      html+=build(s);
      if(s.takeaway) html+=`<div class="callout">${icon("ic-info")}<div>${s.takeaway}</div></div>`;
      stage.innerHTML=html;
      setNav({nextLabel: state.idx===segs.length-1?"Bitir":"Devam"});
    };
  }

  // Fen/Coğrafya: numaralı çağrı-iğneli etiketli diyagram (SVG) + sıralı açıklama listesi.
  function labeledFigure(spec){
    const vb=spec.viewBox||"0 0 480 300", id=vizId(), tid=id+"t", did=id+"d";
    const pins=(spec.labels||[]).map((L,i)=>{
      const n=L.n!=null?L.n:(i+1);
      return `<g><circle class="pin" cx="${L.x}" cy="${L.y}" r="12"/>`
        +`<text class="pin-n" x="${L.x}" y="${L.y}" text-anchor="middle" dominant-baseline="central" font-size="13">${esc(String(n))}</text></g>`;
    }).join("");
    const svg=`<svg class="viz" viewBox="${vb}" role="img" aria-labelledby="${tid} ${did}"><title id="${tid}">${esc(spec.title||"Etiketli şema")}</title><desc id="${did}">${esc(spec.desc||spec.title||"")}</desc>${spec.base||""}${pins}</svg>`;
    const legend=(spec.labels||[]).length
      ? `<ol class="viz-legend-list">${(spec.labels||[]).map(L=>`<li>${esc(L.text||"")}</li>`).join("")}</ol>` : "";
    return `<figure class="viz">${svg}${legend}${spec.caption?`<figcaption>${esc(spec.caption)}</figcaption>`:""}</figure>`;
  }

  // Sosyal/Yurttaşlık: sebep-sonuç / kavram zinciri (HTML grafik düzenleyici).
  function relationFlow(spec){
    const steps=spec.steps||[];
    const nodes=steps.map((st,i)=>{
      const lab=(typeof st==="string")?st:(st.label||"");
      const sub=(typeof st==="object"&&st.sub)?`<div class="flow-node__s">${esc(st.sub)}</div>`:"";
      const tile=`<div class="flow-node"><div class="flow-node__t">${esc(lab)}</div>${sub}</div>`;
      const arrow=i<steps.length-1?`<div class="flow-arrow" aria-hidden="true">${icon("ic-arrow-right")}</div>`:"";
      return tile+arrow;
    }).join("");
    return `<figure class="viz viz--plain"><div class="flow">${nodes}</div>${spec.caption?`<figcaption>${esc(spec.caption)}</figcaption>`:""}</figure>`;
  }

  // Genel/Din/Yurttaşlık: kavram/değer kartları ızgarası (HTML).
  function infoCards(spec){
    const cards=(spec.cards||[]).map(c=>{
      const pic=c.icon?`<svg class="pic" aria-hidden="true" focusable="false"><use href="#${esc(c.icon)}"></use></svg>`:"";
      return `<div class="card">${pic}<h4 class="card__t">${esc(c.term||"")}</h4>${c.desc?`<p class="card__d">${esc(c.desc)}</p>`:""}</div>`;
    }).join("");
    const cls=spec.columns===2?" cards--2":(spec.columns===4?" cards--4":"");
    return `<figure class="viz viz--plain"><div class="cards${cls}">${cards}</div>${spec.caption?`<figcaption>${esc(spec.caption)}</figcaption>`:""}</figure>`;
  }

  // Dil: satır-arası çözümleme / dilbilgisel cinsiyet renk-kodlu cümle (HTML).
  const GLOSS_ROLE={masc:"masc",m:"masc",eril:"masc",fem:"fem",f:"fem",disil:"fem",
    verb:"verb",fiil:"verb",noun:"noun",isim:"noun",ad:"noun",adj:"adj",sifat:"adj",
    article:"art",artikel:"art",det:"art"};
  function glossSentence(spec){
    const toks=(spec.tokens||[]).map(t=>{
      const role=GLOSS_ROLE[String(t.role||"").toLowerCase()]||"";
      const tag=t.tag||t.gloss||"";
      return `<span class="tok"${role?` data-role="${role}"`:""}><span class="w">${esc(t.w||"")}</span>${tag?`<span class="tg">${esc(tag)}</span>`:""}</span>`;
    }).join("");
    const tr=spec.translation?`<p class="gloss-tr">${esc(spec.translation)}</p>`:"";
    const note=spec.note?`<div class="callout callout--info">${icon("ic-info")}<div>${esc(spec.note)}</div></div>`:"";
    const rd=(spec.tokens||[]).map(t=>t.w||"").join(" ")+(spec.translation?". "+spec.translation:"");
    return `<figure class="viz viz--plain"><div class="gloss">${toks}</div>${tr}${spec.caption?`<figcaption>${esc(spec.caption)}</figcaption>`:""}${ttsRow(rd, spec.lang||contentLang())}</figure>${note}`;
  }

  // Dil: iki konuşmacılı diyalog (HTML).
  function dialogue(spec){
    const turns=spec.turns||[];
    const first=(turns[0]&&turns[0].speaker)||"";
    const rows=turns.map(t=>{
      const side=(t.speaker===first)?"a":"b";
      return `<div class="turn turn--${side}"><div class="turn__sp">${esc(t.speaker||"")}</div>`
        +`<div class="turn__b">${esc(t.text||"")}${t.gloss?`<span class="turn__g">${esc(t.gloss)}</span>`:""}</div></div>`;
    }).join("");
    const rd=turns.map(t=>(t.speaker?t.speaker+": ":"")+(t.text||"")).join(". ");
    return `<figure class="viz viz--plain"><div class="dialogue">${rows}</div>${spec.caption?`<figcaption>${esc(spec.caption)}</figcaption>`:""}${ttsRow(rd, spec.lang||contentLang())}</figure>`;
  }

  // Matematik: kanıta dayalı KESİR/ORAN ÇUBUĞU (bar modeli — daire değil).
  //  kind:"fraction" {num,den} · kind:"sum" {addends:[],den} · kind:"ratio" {ratio:[],labels?:[]}
  function fractionBar(spec){
    const kind = spec.kind || (spec.ratio ? "ratio" : (spec.addends ? "sum" : "fraction"));
    const id=vizId(), tid=id+"t", did=id+"d";
    const W=480, BARX=20, BARY=16, BARW=440, BARH=44, EQY=88, H=104;
    const PAL=["var(--accent)","var(--viz-2)","var(--viz-3)","var(--viz-4)","var(--viz-5)"];
    const EMPTY="var(--cds-layer-01)";
    let cells=[], total=0, eq="", desc="", legend="";
    if(kind==="ratio"){
      const r=(spec.ratio||[]).map(n=>Math.max(0,Math.round(+n||0)));
      total=r.reduce((a,b)=>a+b,0)||1;
      r.forEach((cnt,g)=>{ for(let k=0;k<cnt;k++) cells.push(PAL[g%PAL.length]); });
      eq=r.join(" : ");
      const labs=spec.labels||[];
      desc="Oran çubuğu: "+(labs.length?labs.join(", ")+" olmak üzere ":"")+"gruplar "+r.join(" ye ")+" oranında bölünmüş.";
      if(labs.length){ legend=`<div class="viz-legend">`+labs.map((l,i)=>`<span><i style="background:${PAL[i%PAL.length]}"></i>${esc(l)}</span>`).join("")+`</div>`; }
    } else if(kind==="sum"){
      const den=Math.max(1,Math.round(+spec.den||1));
      const ad=(spec.addends||[]).map(n=>Math.max(0,Math.round(+n||0)));
      total=den; let placed=0;
      ad.forEach((cnt,g)=>{ for(let k=0;k<cnt && placed<den;k++){ cells.push(PAL[g%PAL.length]); placed++; } });
      while(placed<den){ cells.push(EMPTY); placed++; }
      const sum=ad.reduce((a,b)=>a+b,0);
      const rhs = sum===den ? "1" : (sum+"\u2044"+den);
      eq=ad.map(a=>a+"\u2044"+den).join(" + ")+" = "+rhs;
      desc="Kesir toplamı: "+ad.map(a=>a+" bölü "+den).join(" artı ")+", toplam "+(sum===den?"bir bütün":sum+" bölü "+den)+".";
    } else {
      const den=Math.max(1,Math.round(+spec.den||1));
      const num=Math.max(0,Math.min(den,Math.round(+spec.num||0)));
      total=den;
      for(let k=0;k<den;k++) cells.push(k<num ? "var(--accent)" : EMPTY);
      eq=num+"\u2044"+den;
      desc="Kesir çubuğu: bütün "+den+" eşit parçaya bölünmüş, "+num+" parça dolu; kesir "+num+" bölü "+den+".";
    }
    const cw=BARW/(total||1);
    let rects="";
    for(let i=0;i<cells.length;i++){
      rects+=`<rect x="${(BARX+i*cw).toFixed(2)}" y="${BARY}" width="${cw.toFixed(2)}" height="${BARH}" fill="${cells[i]}" stroke="var(--cds-border-subtle)" stroke-width="1"/>`;
    }
    const frame=`<rect x="${BARX}" y="${BARY}" width="${BARW}" height="${BARH}" fill="none" stroke="var(--cds-border-strong)" stroke-width="1.5"/>`;
    const eqTxt=`<text class="fb-eq" x="${W/2}" y="${EQY}" text-anchor="middle" font-size="22">${eq}</text>`;
    const title = kind==="ratio" ? "Oran modeli" : (kind==="sum" ? "Kesir toplamı modeli" : "Kesir modeli");
    const svg=`<svg class="viz fraction-bar" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${tid} ${did}">`
      +`<title id="${tid}">${esc(title)}</title><desc id="${did}">${esc(spec.desc||desc)}</desc>`
      +`${rects}${frame}${eqTxt}</svg>`;
    return `<figure class="viz viz--plain">${svg}${legend}${spec.caption?`<figcaption>${esc(spec.caption)}</figcaption>`:""}</figure>`;
  }

  const renderDiagram  = displaySeg("Şema",            s=>labeledFigure(s.diagram||s));
