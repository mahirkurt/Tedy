  /* ---- flashcards (aralıklı tekrar: bilinmeyen sona atılır; v3.0.0 Task 15 — çapraz-oturum
     Leitner kutu önceliklendirmesi + localStorage kalıcılığı, degrade-safe) ---- */
  function renderFlashcards(stage,s){
    // Kayıtlı kutulara göre İLK gösterim SIRASI önceliklenir (düşük kutu = az bilinen/hiç
    // görülmemiş → önce gösterilir); kart SAYISI hiçbir zaman değişmez/atlanmaz — yalnız
    // sıra. Depolama yoksa/boşsa boxOf her anahtar için 1 döner → sıralama no-op'tur
    // (eşit anahtarlarda `a-b` kırılımı orijinal sırayı KORUR) → tam in-session degrade.
    const boxOf = k => state.leitner.box[k]||1;
    const order = s.cards.map((c,i)=>i);
    order.sort((a,b)=> (boxOf(s.id+"#"+a)-boxOf(s.id+"#"+b)) || (a-b));
    function persistBox(key,box){
      state.leitner.box[key]=box;
      state.leitner.due = Object.keys(state.leitner.box).filter(k=>state.leitner.box[k]<=2);
      lsSet(LEITNER_STORE_KEY, state.leitner);
    }
    let queue = order.map(i=>({front:s.cards[i].front,back:s.cards[i].back,hint:s.cards[i].hint,idx:i}));
    const learned = new Set();
    const total = s.cards.length;
    function show(){
      if(queue.length===0){ goNext(); return; }
      const card = queue[0]; let flipped=false;
      let html = segHead(s,"Kart Destesi")+instr(s);
      html += `<div class="streak">Öğrenilen <b>${learned.size}</b> / <b>${total}</b> · Destede <b>${queue.length}</b> kart</div>`;
      html += `<div class="flash"><div class="card" id="fcard">${card.front}</div><div id="fctrl"></div></div>`;
      stage.innerHTML=html;
      setNav({next:false});
      const ctrl=$("#fctrl");
      function renderCtrl(moveFocus){
        ctrl.innerHTML="";
        if(!flipped){
          const flip=el("button","btn btn--primary btn--center"); flip.innerHTML=icon("ic-view")+" Çevir";
          flip.addEventListener("click",()=>{
            flipped=true; const fc=$("#fcard"); fc.className="card card--back";
            fc.innerHTML='<div class="fc-back"><div class="fc-back__def">'+card.back+'</div>'
              +(card.hint?'<div class="fc-hint">'+icon("ic-help")+'<span><b>İpucu:</b> '+card.hint+'</span></div>':'')
              +ttsBtn(stripTags(card.back)+(card.hint?". İpucu: "+stripTags(card.hint):""), (card.lang||defLang()))
              +'</div>';
            renderCtrl(true);
          });
          ctrl.appendChild(flip);
        } else {
          const row=el("div"); row.style.cssText="display:flex;gap:var(--sp-05);justify-content:center;flex-wrap:wrap;margin-top:var(--sp-05)";
          const know=el("button","btn btn--primary"); know.innerHTML=icon("ic-check")+" Biliyorum";
          const again=el("button","btn btn--ghost"); again.innerHTML=icon("ic-renew")+" Tekrar et";
          know.addEventListener("click",()=>{
            if(!learned.has(card.idx)){ learned.add(card.idx); addXP(D.rewards.xpPerCorrect); markMastered(); bumpStreak(); }
            persistBox(s.id+"#"+card.idx, Math.min(5, boxOf(s.id+"#"+card.idx)+1));
            queue.shift(); show();
          });
          again.addEventListener("click",()=>{
            persistBox(s.id+"#"+card.idx, 1);
            const c=queue.shift(); queue.push(c); show();
          });
          row.appendChild(know); row.appendChild(again); ctrl.appendChild(row);
        }
        if(moveFocus) focusActionButton(ctrl.querySelector("button"));
      }
      renderCtrl();
      focusStageHeading(stage);
    }
    show();
  }

  /* ---- order (sıraya diz: sıradaki doğruyu seç) ---- */
  function renderOrder(stage,s){
    const shown = s.items.map((t,i)=>({t,correct:i}));
    for(let i=shown.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shown[i],shown[j]]=[shown[j],shown[i]];}
    let expected=0;
    let html=segHead(s,"Sıraya Diz")+instr(s);
    if(s.prompt) html+=`<p class="q-stem">${s.prompt}</p>`;
    html+=`<div class="opt-list" role="group" aria-label="Sıralanacak öğeler">`;
    shown.forEach(it=>{ html+=`<button class="opt" type="button" data-c="${it.correct}"><span class="opt__mark"></span><span>${it.t}</span></button>`; });
    html+=`</div><div id="ofb" aria-live="polite"></div>`;
    stage.innerHTML=html;
    setNav({next:false});
    stage.querySelectorAll(".opt").forEach(btn=>{
      btn.addEventListener("click",()=>{
        if(btn.disabled) return;
        if(+btn.dataset.c===expected){
          btn.classList.add("opt--correct"); btn.disabled=true;
          btn.querySelector(".opt__mark").innerHTML=`<span style="font-family:var(--font-mono);font-weight:700;color:var(--cds-support-success)">${expected+1}</span>`;
          const gk=s.id+"#"+expected;
          if(!state.awarded.has(gk)){state.awarded.add(gk);addXP(D.rewards.xpPerCorrect);markMastered();bumpStreak();}
          expected++;
          if(expected===shown.length){
            const fb=$("#ofb"); fb.className="feedback feedback--ok";
            fb.innerHTML=icon("ic-check")+`<div><b>Doğru sıra!</b></div>`;
            setNav({nextLabel: state.idx===segs.length-1?"Bitir":"Devam"});
            focusActionButton($("#nextBtn"));
          } else {
            focusFirstUsableOption(stage);
          }
        } else {
          const fb=$("#ofb"); fb.className="feedback feedback--no"; resetStreak();
          fb.innerHTML=icon("ic-close")+`<div><b>Sıradaki bu değil.</b> ${expected+1}. sırada gelecek öğeyi seç.</div>`;
          const b=btn; b.classList.add("opt--wrong"); sectionTimeout(()=>b.classList.remove("opt--wrong"),500);
        }
      });
    });
  }

  /* ---- sorting (gruplara ayır: her öğeyi doğru kutuya) ---- */
  function renderSorting(stage,s){
    let ii=0;
    function show(){
      const it=s.items[ii];
      let html=segHead(s,"Gruplara Ayır")+instr(s);
      if(s.prompt) html+=`<p class="q-stem">${s.prompt}</p>`;
      html+=`<div class="streak">Öğe <b>${ii+1}</b> / <b>${s.items.length}</b></div>`;
      html+=`<div class="card" style="min-height:auto;padding:var(--sp-06);font-size:var(--fs-h-sub)">${it.label}</div>`;
      html+=`<div class="opt-list" role="group" aria-label="Kategoriler">`;
      s.bins.forEach((b,bi)=>{ html+=`<button class="opt" type="button" data-bin="${bi}"><span class="opt__mark"></span><span>${b}</span></button>`; });
      html+=`</div><div id="sfb" aria-live="polite"></div>`;
      stage.innerHTML=html;
      setNav({next:false});
      const gk=s.id+"#"+ii;
      stage.querySelectorAll(".opt").forEach(btn=>{
        btn.addEventListener("click",()=>{
          if(btn.disabled) return;
          if(+btn.dataset.bin===it.bin){
            btn.classList.add("opt--correct"); btn.querySelector(".opt__mark").innerHTML=icon("ic-check");
            stage.querySelectorAll(".opt").forEach(b=>b.disabled=true);
            if(!state.awarded.has(gk)){state.awarded.add(gk);addXP(D.rewards.xpPerCorrect);markMastered();bumpStreak();}
            const fb=$("#sfb"); fb.className="feedback feedback--ok";
            fb.innerHTML=icon("ic-check")+`<div><b>Doğru!</b> «${it.label}» &#8594; ${s.bins[it.bin]}</div>`;
            const last=ii===s.items.length-1;
            const nb=el("button","btn btn--primary"); nb.style.marginTop="var(--sp-05)";
            nb.innerHTML=(last?"Tamamla":"Sonraki")+" "+icon("ic-arrow-right");
            nb.addEventListener("click",()=>{ if(last){goNext();} else {ii++;show();} });
            stage.appendChild(nb);
            focusActionButton(nb);
          } else {
            btn.classList.add("opt--wrong"); btn.disabled=true;
            const fb=$("#sfb"); fb.className="feedback feedback--no"; resetStreak();
            fb.innerHTML=icon("ic-close")+`<div><b>Bu kategori değil.</b> Tekrar dene.</div>`;
            focusFirstUsableOption(stage);
          }
        });
      });
      focusStageHeading(stage);
    }
    show();
  }

  /* ---- hotspot (görselde doğru bölgeyi bul ve tıkla) ---- */
  function renderHotspot(stage,s){
    let pi=0;
    function show(){
      const sp=s.spots[pi];
      let html=segHead(s,"Görseli Keşfet")+instr(s);
      html+=`<div class="streak">İpucu <b>${pi+1}</b> / <b>${s.spots.length}</b></div>`;
      html+=`<p class="q-stem">Bul ve tıkla: <span style="color:var(--accent-strong)">${sp.label}</span></p>`;
      html+=`<div class="visual hotspot-wrap">${s.svg}</div><div id="hfb" aria-live="polite"></div>`;
      stage.innerHTML=html;
      setNav({next:false});
      stage.querySelectorAll("[data-spot]").forEach(r=>{
        const meta=(s.spots.find(x=>x.id===r.getAttribute("data-spot"))||{});
        r.setAttribute("role","button"); r.setAttribute("tabindex","0");
        r.setAttribute("aria-label", meta.label||"bölge");
        const handler=()=>{
          if(r.dataset.done) return;
          if(r.getAttribute("data-spot")===sp.id){
            r.dataset.done="1"; r.style.outline="3px solid var(--cds-support-success)"; r.style.outlineOffset="2px";
            const gk=s.id+"#"+pi;
            if(!state.awarded.has(gk)){state.awarded.add(gk);addXP(D.rewards.xpPerCorrect);markMastered();}
            const fb=$("#hfb"); fb.className="feedback feedback--ok";
            fb.innerHTML=icon("ic-check")+`<div><b>Buldun!</b> ${sp.info||""}</div>`;
            const last=pi===s.spots.length-1;
            const nb=el("button","btn btn--primary"); nb.style.marginTop="var(--sp-05)";
            nb.innerHTML=(last?"Tamamla":"Sonraki")+" "+icon("ic-arrow-right");
            nb.addEventListener("click",()=>{ if(last){goNext();} else {pi++;show();} });
            stage.appendChild(nb);
            focusActionButton(nb);
          } else {
            const fb=$("#hfb"); fb.className="feedback feedback--no";
            fb.innerHTML=icon("ic-close")+`<div><b>Burası değil.</b> «${sp.label}» nerede olabilir? Tekrar dene.</div>`;
          }
        };
        r.addEventListener("click",handler);
        r.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();handler();} });
      });
    }
    show();
  }

  /* ---- timeline (zaman çizelgesi — display materyali, notsuz) ---- */
  function renderTimeline(stage,s){
    let html=segHead(s,"Zaman Çizelgesi")+instr(s);
    if(s.prompt) html+=`<p class="lead">${s.prompt}</p>`;
    html+=`<ol class="timeline">`;
    (s.events||[]).forEach((e,i)=>{
      html+=`<li class="tl-item"><div class="tl-node">${i+1}</div>
        <div class="tl-card">${e.date?`<div class="tl-when">${e.date}</div>`:""}
        <div class="tl-label">${e.label||""}</div>
        ${e.detail?`<div class="tl-detail">${e.detail}</div>`:""}</div></li>`;
    });
    html+=`</ol>`;
    stage.innerHTML=html;
    setNav({nextLabel: state.idx===segs.length-1?"Bitir":"Devam"});
  }

  init();
})();

/* ===== Carbon DefinitionTooltip — anahtar kavram tanım popover'ı =====
   .def-term tetikleyicilerine hover/odakla tema-duyarlı, oklu, ekran
   kenarına uyarlanan (flip + clamp) tanım kartı. Olay delegasyonu ile
   stage yeniden render edilse de çalışır; aria-describedby ile erişilebilir. */
(function(){
  var pop=document.createElement("div");
  pop.className="def-pop"; pop.id="defPop"; pop.setAttribute("role","tooltip"); pop.hidden=true;
  pop.innerHTML='<span class="def-pop__head"><span class="def-pop__ic" aria-hidden="true"></span><span class="def-pop__term"></span></span><span class="def-pop__def"></span><span class="def-pop__ex" hidden><span class="def-pop__ex-lbl">Örnek</span><span class="def-pop__ex-t"></span></span><span class="def-pop__arrow" aria-hidden="true"></span>';
  document.body.appendChild(pop);
  var cur=null;
  function place(btn){
    var r=btn.getBoundingClientRect(), m=12, gap=10;
    var pw=pop.offsetWidth, ph=pop.offsetHeight;
    var left=r.left+r.width/2-pw/2;
    left=Math.max(m, Math.min(left, window.innerWidth-pw-m));
    var top=r.top-ph-gap, pos="top";
    if(top<m){ top=r.bottom+gap; pos="bottom"; }
    pop.style.left=left+"px"; pop.style.top=top+"px"; pop.setAttribute("data-place",pos);
    pop.style.setProperty("--arrow-x",(r.left+r.width/2-left)+"px");
  }
  function show(btn){
    cur=btn;
    var ic=(btn.getAttribute("data-icon")||"").replace(/[^a-z0-9-]/gi,"");
    var ich=pop.querySelector(".def-pop__ic");
    ich.innerHTML= ic? '<svg class="cds-icon" aria-hidden="true"><use href="#'+ic+'"></use></svg>' : "";
    ich.style.display= ic? "" : "none";
    pop.querySelector(".def-pop__term").textContent=btn.getAttribute("data-term")||"";
    pop.querySelector(".def-pop__def").textContent=btn.getAttribute("data-def")||"";
    var ex=btn.getAttribute("data-ex")||"";
    pop.querySelector(".def-pop__ex-t").textContent=ex;
    pop.querySelector(".def-pop__ex").hidden=!ex;
    pop.hidden=false; btn.setAttribute("aria-describedby","defPop"); place(btn);
  }
  function hide(btn){
    if(btn&&btn!==cur) return;
    pop.hidden=true; if(cur) cur.removeAttribute("aria-describedby"); cur=null;
  }
  function near(e){ return (e.target&&e.target.closest)?e.target.closest(".def-term"):null; }
  document.addEventListener("mouseover",function(e){ var b=near(e); if(b) show(b); });
  document.addEventListener("mouseout",function(e){ var b=near(e); if(b){ var t=e.relatedTarget; if(!t||!t.closest||!t.closest(".def-term")) hide(b); } });
  document.addEventListener("focusin",function(e){ var b=near(e); if(b) show(b); });
  document.addEventListener("focusout",function(e){ var b=near(e); if(b) hide(b); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&cur) hide(cur); });
  window.addEventListener("scroll",function(){ if(cur) place(cur); },true);
  window.addEventListener("resize",function(){ if(cur) hide(cur); });
})();
</script>
</body>
</html>
