  --cds-layer-hover-01:#e8e8e8; --cds-layer-active-01:#c6c6c6; --cds-layer-selected-01:#e0e0e0;

:root{
  /* Carbon spacing ölçeği — @carbon/layout (2px mini-unit) */
  --cds-spacing-01:.125rem; --cds-spacing-02:.25rem; --cds-spacing-03:.5rem;
  --cds-spacing-04:.75rem; --cds-spacing-05:1rem; --cds-spacing-06:1.5rem;
  --cds-spacing-07:2rem; --cds-spacing-08:2.5rem; --cds-spacing-09:3rem;
  --cds-spacing-10:4rem; --cds-spacing-11:5rem; --cds-spacing-12:6rem; --cds-spacing-13:10rem;
  --sp-01:var(--cds-spacing-01); --sp-02:var(--cds-spacing-02); --sp-03:var(--cds-spacing-03);
  --sp-04:var(--cds-spacing-04); --sp-05:var(--cds-spacing-05); --sp-06:var(--cds-spacing-06);
  --sp-07:var(--cds-spacing-07); --sp-08:var(--cds-spacing-08); --sp-09:var(--cds-spacing-09);
  --sp-10:var(--cds-spacing-10);
  --fs-display:2.5rem; --fs-h-seg:1.75rem; --fs-h-sub:1.25rem;
  --fs-body:1.125rem; --fs-compact:1rem; --fs-label:.875rem;
  --ls-label:.32px; /* @carbon/type label/code letter-spacing */
  /* Carbon hareket — @carbon/motion: 6 süre + productive/expressive 3'er easing */
  --cds-duration-fast-01:70ms; --cds-duration-fast-02:110ms;
  --cds-duration-moderate-01:150ms; --cds-duration-moderate-02:240ms;
  --cds-duration-slow-01:400ms; --cds-duration-slow-02:700ms;
  --cds-easing-standard-productive:cubic-bezier(.2,0,.38,.9);
  --cds-easing-standard-expressive:cubic-bezier(.4,.14,.3,1);
  --cds-easing-entrance-productive:cubic-bezier(0,0,.38,.9);
  --cds-easing-entrance-expressive:cubic-bezier(0,0,.3,1);
  --cds-easing-exit-productive:cubic-bezier(.2,0,1,.9);
  --cds-easing-exit-expressive:cubic-bezier(.4,.14,1,1);
  --dur-fast:var(--cds-duration-fast-02); --dur-mod:var(--cds-duration-moderate-02);
  --dur-slow:var(--cds-duration-slow-01);
  --ease-std:var(--cds-easing-standard-productive);
  --ease-expr:var(--cds-easing-standard-expressive);
  --ease-entrance:var(--cds-easing-entrance-expressive);
  --ease-exit:var(--cds-easing-exit-expressive);
  --cds-radius:8px; --radius-btn:6px; --tap:48px; /* tap = Carbon size Large (3rem) */
  --font-sans:'IBM Plex Sans',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  --font-serif:'IBM Plex Serif',Georgia,Times,serif;
  --font-mono:'IBM Plex Mono',Menlo,'DejaVu Sans Mono',ui-monospace,monospace;
  --accent:#0f62fe; --accent-strong:#0043ce; --accent-tint:#edf5ff;
  --viz-1:#6929c4; --viz-2:#002d9c; --viz-3:#1192e8; --viz-4:#007d79; --viz-5:#9f1853;
  --viz-grid:#e0e0e0; --viz-axis:#8d8d8d; --viz-track:#e0e0e0;
  --viz-sun:#f1c21b; --viz-water:#1192e8; --viz-cloud:#c1c7cd;
}
::selection{background:var(--cds-highlight);color:var(--cds-text-primary)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;max-width:100%}
body{font-family:var(--font-sans);font-size:var(--fs-body);line-height:1.6;
  color:var(--cds-text-primary);background:var(--cds-background);-webkit-font-smoothing:antialiased;
  overflow-wrap:anywhere;
  transition:background var(--dur-mod) var(--ease-std),color var(--dur-mod) var(--ease-std)}
.wrap{width:100%;max-width:880px;min-width:0;margin:0 auto;padding:var(--sp-05);min-height:100vh;display:flex;flex-direction:column}
.cds-icon{display:inline-block;width:1.25rem;height:1.25rem;fill:currentColor;vertical-align:middle;flex:none}
.pic{display:inline-block;fill:currentColor;color:var(--accent-strong)}
/* ============================================================
   ÜST ÇUBUK — İKİ KATMANLI CARBON HEADER
   Carbon katmanlama (layering) ilkesi: renkli KİMLİK bandı (ders
   aksanı + açık içerik) ile nötr DURUM şeridi (ProgressIndicator +
   Tag rozetleri) ayrı yüzeylerde. Tek kapsayıcı; overflow:hidden ile
   köşeler kırpılır. Boşluklar Carbon 2x-grid ölçeğinden (--sp-0X).
   Motor sınıfları korunur (step--done/current, badge--earned,
   icon-btn--on, streak-chip); ".topbar X" override'ları temel
   tanımları geçersiz kılar.
   ============================================================ */
.topbar{position:relative;margin-bottom:var(--sp-06);border-radius:12px;overflow:hidden;
  border:1px solid var(--cds-border-subtle);box-shadow:0 6px 20px -16px rgba(0,0,0,.55)}

/* --- KATMAN 1 · Kimlik bandı (ders aksanı, açık içerik) --- */
.topbar__hero{position:relative;color:#fff;padding:var(--sp-05) var(--sp-06);
  background:linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 78%, #000) 100%)}
.topbar__hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 150% at 100% 0%, rgba(255,255,255,.16), transparent 60%)}
.topbar__row{position:relative;display:flex;align-items:center;justify-content:space-between;
  gap:var(--sp-04) var(--sp-05);flex-wrap:wrap}
.topbar__l{display:flex;align-items:center;gap:var(--sp-05);min-width:0;max-width:100%;flex:1 1 260px}
.topbar__l>div{min-width:0}
.topbar #coverPic{width:26px;height:26px;box-sizing:content-box;padding:9px;flex:none;color:#fff;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:10px}
.topbar__title{font-size:1.5rem;line-height:1.2;font-weight:600;letter-spacing:-.01em;margin:0;color:#fff;overflow-wrap:anywhere}
.meta-line{font-size:.8125rem;line-height:1.25;color:rgba(255,255,255,.85);margin-top:var(--sp-02);
  font-weight:400;letter-spacing:.01em;overflow-wrap:anywhere}
.topbar__r{display:flex;align-items:center;justify-content:flex-end;gap:var(--sp-04);
  flex:1 1 auto;flex-wrap:wrap;min-width:0;max-width:100%}
/* XP / seri — Carbon Tag (cam) */
.xp{font-family:var(--font-sans);font-weight:600;font-size:.8125rem;display:inline-flex;align-items:center;
  gap:6px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.25);
  border-radius:99px;padding:var(--sp-02) var(--sp-04);white-space:nowrap}
.xp .cds-icon{color:#ffd56b;width:1rem;height:1rem}
.xp #xpValue{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:700}
.topbar .xp-float{color:#ffe9a8}
.topbar .streak-chip{font-family:var(--font-sans);font-weight:600;font-size:.8125rem;display:inline-flex;
  align-items:center;gap:5px;background:rgba(255,255,255,.15);color:#fff;
  border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:var(--sp-02) var(--sp-04)}
.topbar .streak-chip .cds-icon{color:#ffd56b;width:1rem;height:1rem}
.topbar .streak-float{color:#ffe9a8}
/* v3.0.0 — Task 10: kaygısız tempo diski (opsiyonel/varsayılan KAPALI; gamified-flows.md §3.4).
   Sayısız + kesintisiz: yalnız bir SVG yay, hiçbir sayısal metin/geri-sayım yok. */
.pacing-disk{display:inline-flex;align-items:center;gap:var(--sp-02);
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
  border-radius:99px;padding:2px 2px 2px var(--sp-03)}
.pacing-disk[hidden]{display:none}
.pacing-disk__ring{flex:none}
.pacing-disk__track{fill:none;stroke:rgba(255,255,255,.32);stroke-width:3}
.pacing-disk__arc{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round}
.pacing-disk__dismiss{width:22px;height:22px;border:none;background:transparent;color:#fff;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;opacity:.85}
.pacing-disk__dismiss:hover{background:rgba(255,255,255,.18);opacity:1}
.pacing-disk__dismiss:focus-visible{outline:2px solid #fff;outline-offset:2px}
.pacing-disk__dismiss .cds-icon{width:.8rem;height:.8rem}
/* yardımcı düğmeler — Carbon ghost ikon düğme dili, ince ayraçla */
.topbar__tools{display:inline-flex;align-items:center;gap:var(--sp-02);max-width:100%;flex-wrap:wrap;
  padding-left:var(--sp-03);border-left:1px solid rgba(255,255,255,.22)}
.icon-btn{width:40px;height:40px;border:none;background:transparent;cursor:pointer;color:#fff;
  display:inline-flex;align-items:center;justify-content:center;border-radius:8px;
  transition:background var(--dur-fast) var(--ease-std)}
.icon-btn:hover{background:rgba(255,255,255,.18)}
.icon-btn:active{background:rgba(255,255,255,.28)}
.icon-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.icon-btn .cds-icon{width:1.25rem;height:1.25rem}
.topbar .icon-btn--on{background:rgba(255,255,255,.92);color:var(--accent)}
.topbar .icon-btn--on .cds-icon{color:var(--accent)}

/* --- KATMAN 2 · Durum şeridi (nötr Carbon layer-01) --- */
.topbar__status{background:var(--cds-layer-01);padding:var(--sp-05) var(--sp-06);
  display:flex;flex-direction:column;gap:var(--sp-05)}
.topbar__progress{display:flex;align-items:center;justify-content:space-between;
  gap:var(--sp-04) var(--sp-05);flex-wrap:wrap}
/* Carbon ProgressIndicator — numaralı; tamamlanan=aksan+tik, aktif=aksan halka, bekleyen=içi boş */
.stepper{display:flex;align-items:center;gap:0;overflow-x:auto;scrollbar-width:thin;
  flex:1 1 auto;min-width:0;padding-bottom:2px}
.step{display:flex;align-items:center;flex:none}
.step__btn{width:28px;height:28px;border-radius:50%;border:none;cursor:default;flex:none;
  display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-mono);
  font-size:.8rem;font-weight:600;background:transparent;color:var(--cds-text-secondary);
  box-shadow:inset 0 0 0 1.5px var(--cds-border-strong);
  transition:background var(--dur-fast) var(--ease-std),box-shadow var(--dur-fast),color var(--dur-fast)}
.step__btn:focus-visible{outline:2px solid var(--cds-focus);outline-offset:2px}
.step__btn .cds-icon{width:1rem;height:1rem}
.step--done .step__btn{background:var(--accent-strong);color:var(--cds-background);box-shadow:none;cursor:pointer}
.step--current .step__btn{background:transparent;color:var(--accent-strong);box-shadow:inset 0 0 0 2px var(--accent-strong)}
.step__line{width:20px;height:1.5px;background:var(--cds-border-subtle);flex:none}
.step--done .step__line{background:var(--accent-strong)}
/* v3.0.0 — kilometre taşı (milestone) işareti: aksan nokta, gölgesiz (G-CARBON-GRID) */
.step--milestone .step__btn{position:relative}
.step--milestone .step__btn::after{content:"";position:absolute;left:50%;bottom:-5px;
  transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent-strong)}
.rail-label{font-size:.8125rem;color:var(--cds-text-secondary);display:flex;align-items:center;
  gap:var(--sp-03);flex:none;white-space:nowrap}
.rail-label #railText{color:var(--cds-text-primary);font-weight:600}
/* v3.0.0 — hedef-gradyanı: "son N durak" etiketi, yalnız dolu iken görünür */
.rail-label #railGoal{color:var(--accent-strong);font-weight:600}
.rail-label #railGoal:empty{display:none}
/* Carbon Tag rozetleri — kilitli=nötr çip, kazanılan=aksan çip */
.badges{display:flex;gap:var(--sp-03);flex-wrap:wrap}
.badges:empty{display:none}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:500;
  border:1px solid var(--cds-border-subtle);border-radius:99px;padding:var(--sp-02) var(--sp-04);
  color:var(--cds-text-secondary);background:var(--cds-layer-02)}
.badge .pic,.badge .cds-icon{width:.95rem;height:.95rem;color:var(--cds-icon-secondary)}
.badge__lock{width:.8rem;height:.8rem;fill:currentColor;color:var(--cds-icon-secondary);opacity:.6;margin-left:1px;flex:none}
.badge--locked{opacity:.78}
.badge--earned{border-color:transparent;color:var(--accent-strong);background:var(--accent-tint);font-weight:600}
.badge--earned .pic,.badge--earned .cds-icon{color:var(--accent-strong)}
/* v3.0.0 — Task 10: Sefer mini-haritası (opsiyonel; meta.quest.stations, üst-çubuk altında şerit).
   İlk istasyon completed:true ile bahşedilmiş ilerleme (gamified-flows.md §3.2); gölgesiz düğümler. */
.quest-map{margin:0 0 var(--sp-06)}
.quest-map[hidden]{display:none}
.quest-map__svg{display:block;width:100%;height:auto;max-width:280px;margin:0 auto}
.quest-map__line{stroke:var(--cds-border-strong);stroke-width:2}
.quest-map__line--done{stroke:var(--accent-strong)}
.quest-map__node{fill:var(--cds-layer-02);stroke:var(--cds-border-strong);stroke-width:2}
.quest-map__node--done{fill:var(--accent-strong);stroke:var(--accent-strong)}
.quest-map__label{font-family:var(--font-sans);font-size:10px;fill:var(--cds-text-secondary)}
/* sahne */
.stage{background:var(--cds-layer-01);border:1px solid var(--cds-border-subtle);
  border-radius:var(--cds-radius);padding:var(--sp-07);flex:1;min-width:0;max-width:100%}
.seg-head{display:flex;align-items:center;gap:var(--sp-05);margin-bottom:var(--sp-06);padding-bottom:var(--sp-05);border-bottom:1px solid var(--cds-border-subtle)}
.seg-head>div{min-width:0}
.seg-ic{flex:none;width:56px;height:56px;border-radius:14px;background:var(--accent-tint);display:inline-flex;align-items:center;justify-content:center}
.seg-ic .pic{color:var(--accent-strong);width:32px;height:32px}
.seg-head h2{font-size:var(--fs-h-seg);font-weight:600;margin:0;line-height:1.25}
.kicker{font-size:var(--fs-label);font-weight:600;color:var(--accent-strong);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.seg-body p{margin:0 0 var(--sp-05)}
.seg-body ul,.seg-body ol{margin:0 0 var(--sp-05);padding-left:1.4em}
.seg-body li{margin-bottom:var(--sp-03)}
.lead{font-family:var(--font-serif);font-size:1.25rem;line-height:1.55;color:var(--cds-text-primary);
  background:var(--accent-tint);border-left:4px solid var(--accent);border-radius:var(--cds-radius);
  padding:var(--sp-05) var(--sp-06);margin:0 0 var(--sp-06)}
mark.term{background:var(--accent-tint);color:var(--accent-strong);padding:0 .25em;border-radius:4px;font-weight:600}
/* Anahtar kavramlar — Carbon DefinitionTooltip tetikleyicileri */
.terms{display:flex;flex-direction:column;gap:var(--sp-04);margin:var(--sp-06) 0;
  background:var(--cds-layer-02);border:1px solid var(--cds-border-subtle);
  border-radius:var(--cds-radius);padding:var(--sp-05)}
.terms__lbl{font-size:.8125rem;color:var(--cds-text-secondary);font-weight:500;letter-spacing:.02em}
.terms__list{display:flex;flex-wrap:wrap;gap:var(--sp-03);align-items:center}
.def-term{font-family:var(--font-sans);font-size:var(--fs-compact);font-weight:600;
  background:var(--accent-tint);color:var(--accent-strong);border-radius:99px;
  border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);
  padding:var(--sp-02) var(--sp-05);cursor:help;display:inline-flex;align-items:center;gap:6px;
  transition:background var(--dur-fast) var(--ease-std),box-shadow var(--dur-fast) var(--ease-std)}
.def-term:hover{background:color-mix(in srgb,var(--accent) 16%,var(--cds-layer-02));
  box-shadow:0 2px 9px -3px color-mix(in srgb,var(--accent) 70%,transparent)}
.def-term:focus-visible{outline:2px solid var(--cds-focus);outline-offset:2px}
.def-term .cds-icon{width:.9rem;height:.9rem;color:var(--accent-strong);opacity:.85;flex:none}
.def-term[aria-describedby] .cds-icon{opacity:1}
/* tanım popover — tema-duyarlı, oklu kart; ekran kenarına flip+clamp (JS konumlu) */
.def-pop{position:fixed;z-index:9999;width:max-content;max-width:300px;
  padding:var(--sp-04) var(--sp-05);border-radius:8px;font-family:var(--font-sans);
  background:var(--def-pop-bg);color:var(--def-pop-fg);
  box-shadow:0 8px 24px -8px rgba(0,0,0,.45);pointer-events:none;
  opacity:0;transform:translateY(3px);
  transition:opacity var(--dur-fast) var(--ease-std),transform var(--dur-fast) var(--ease-std)}
.def-pop:not([hidden]){opacity:1;transform:none}
.def-pop[hidden]{display:none}
.def-pop__head{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.def-pop__ic{display:inline-flex;flex:none}
.def-pop__ic .cds-icon{width:1.05rem;height:1.05rem;color:var(--def-pop-accent)}
.def-pop__term{font-weight:700;font-size:.875rem;color:var(--def-pop-accent)}
.def-pop__ex{display:block;margin-top:var(--sp-04);padding-top:var(--sp-04);
  border-top:1px solid var(--def-pop-rule);font-size:.78rem;line-height:1.45}
.def-pop__ex[hidden]{display:none}
.def-pop__ex-lbl{font-family:var(--font-sans);font-weight:700;font-size:.6875rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--def-pop-accent);margin-right:6px}
.def-pop__ex-t{color:var(--def-pop-fg);opacity:.92}
.def-pop__def{display:block;font-weight:400;font-size:.8125rem;line-height:1.5;color:var(--def-pop-fg)}
.def-pop__arrow{position:absolute;left:var(--arrow-x,50%);width:11px;height:11px;
  background:var(--def-pop-bg);transform:translateX(-50%) rotate(45deg)}
.def-pop[data-place="top"] .def-pop__arrow{bottom:-5px}
.def-pop[data-place="bottom"] .def-pop__arrow{top:-5px}
@media (prefers-reduced-motion: reduce){.def-pop{transition:none}}
[data-theme="white"]{--def-pop-bg:#393939;--def-pop-fg:#f4f4f4;--def-pop-accent:color-mix(in srgb,var(--accent) 50%,#ffffff);--def-pop-rule:rgba(255,255,255,.20)}
[data-theme="g100"]{--def-pop-bg:#f4f4f4;--def-pop-fg:#262626;--def-pop-accent:color-mix(in srgb,var(--accent) 82%,#000000);--def-pop-rule:rgba(22,22,22,.14)}
.visual{margin:var(--sp-06) 0;text-align:center;background:var(--cds-layer-02);
  border:1px solid var(--cds-border-subtle);border-radius:var(--cds-radius);padding:var(--sp-06)}
.visual svg{max-width:100%;height:auto}
/* tema-duyarlı SVG figür sistemi (charts + özgün diyagram) */
figure.viz{margin:var(--sp-06) 0;background:var(--cds-layer-02);border:1px solid var(--cds-border-subtle);
  border-radius:var(--cds-radius);padding:var(--sp-06);text-align:center}
figure.viz svg{max-width:100%;height:auto;display:block;margin:0 auto}
figure.viz figcaption{margin-top:var(--sp-04);font-size:var(--fs-label);color:var(--cds-text-secondary)}
.viz text{fill:var(--cds-text-primary);font-family:var(--font-sans)}
.viz .viz-muted{fill:var(--cds-text-secondary)}
.viz .viz-axis{stroke:var(--viz-axis)}
.viz .viz-grid{stroke:var(--viz-grid)}
.viz-legend{display:flex;flex-wrap:wrap;gap:var(--sp-03) var(--sp-05);justify-content:center;margin-top:var(--sp-05)}
.viz-legend span{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-label);color:var(--cds-text-secondary)}
.viz-legend i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
/* v3.0.0 — Task 19: numberLine(spec) `interactive:true` iken üretilen sürüklenebilir/
   klavye-adımlı nokta. Gölge yok (yalnız inset — G-CARBON-GRID); ok-renkli dolgu
   token'lı (ham hex yok — G-SVG). Geçiş yalnızca hareket-azaltma TERCİH EDİLMEDİĞİNDE
   tanımlıdır (reduceMotion() JS tarafında da handle.style.transition="none" ile
   ikinci bir garanti kurar — bkz. wireNumberlineInteractive): reduced-motion altında
   konum değişimi mimari olarak ANINDADIR. */
.nl-handle{fill:var(--accent);stroke:var(--cds-background,transparent);stroke-width:2;cursor:grab;touch-action:none}
.nl-handle:focus-visible{outline:2px solid var(--cds-focus);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
  .nl-handle{transition:cx var(--dur-fast) var(--ease-std)}
}
.nl-readout{margin-top:var(--sp-04);font-size:var(--fs-compact);font-weight:600;
  color:var(--accent-strong);font-variant-numeric:tabular-nums}
/* yüksek-etki ama sakin: segment başına tek, reduced-motion ile kapalı giriş */
@media (prefers-reduced-motion:no-preference){
  @keyframes segIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .stage[data-seg]{animation:segIn var(--cds-duration-moderate-02) var(--ease-entrance) both}
}
.instructions{font-size:var(--fs-compact);color:var(--cds-text-secondary);margin-bottom:var(--sp-05);
  display:flex;align-items:flex-start;gap:var(--sp-04);padding:var(--sp-04) var(--sp-05);
  border-radius:var(--cds-radius);background:var(--accent-tint);border-left:4px solid var(--accent)}
.instructions .cds-icon{color:var(--accent-strong);flex:none;margin-top:2px;width:1.15rem;height:1.15rem}
.instructions span{line-height:1.45}
/* butonlar — birincil = Blue 60 (kontrast garantili) */
.btn{font-family:var(--font-sans);font-size:var(--fs-compact);font-weight:500;min-height:var(--tap);
  padding:0 var(--sp-06);border:none;border-radius:var(--radius-btn);cursor:pointer;display:inline-flex;
  align-items:center;justify-content:space-between;gap:var(--sp-05);transition:background var(--dur-fast) var(--ease-std)}
.btn:focus-visible{outline:2px solid var(--cds-focus);outline-offset:2px}
.btn--primary{background:var(--cds-button-primary);color:var(--cds-text-on-color)}
.btn--primary:hover{background:var(--cds-button-primary-hover)}
.btn--primary:active{background:var(--cds-button-primary-active)}
.btn--ghost{background:transparent;color:var(--cds-link-primary);box-shadow:inset 0 0 0 1px var(--cds-border-strong)}
.btn--ghost:hover{background:var(--cds-background-hover)}
.btn--ghost:active{background:var(--cds-background-active)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .cds-icon{width:1.15rem;height:1.15rem}
.btn--center{justify-content:center}
/* Carbon selectable Tile */
.opt-list{display:flex;flex-direction:column;gap:var(--sp-04);margin:var(--sp-05) 0}
.opt{font-family:var(--font-sans);font-size:var(--fs-body);text-align:left;min-height:var(--tap);
  padding:var(--sp-05) var(--sp-06);border-radius:var(--cds-radius);cursor:pointer;background:var(--cds-layer-02);
  box-shadow:inset 0 0 0 1px var(--cds-border-tile);display:flex;align-items:center;gap:var(--sp-05);
  width:100%;min-width:0;max-width:100%;color:var(--cds-text-primary);position:relative;
  transition:box-shadow var(--dur-fast) var(--ease-std),background var(--dur-fast)}
.opt>span:last-child{min-width:0;overflow-wrap:anywhere}
.opt:hover:not([disabled]){box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-tint)}
.opt:focus-visible{outline:2px solid var(--cds-focus);outline-offset:2px}
.opt[disabled]{cursor:default}
.opt__mark{flex:none;width:1.5rem;height:1.5rem;display:inline-flex;align-items:center;justify-content:center}
.opt--correct{box-shadow:inset 0 0 0 2px var(--cds-support-success);
  background:color-mix(in srgb,var(--cds-support-success) 14%,var(--cds-layer-02))}
.opt--correct .opt__mark{color:var(--cds-support-success)}
.opt--wrong{box-shadow:inset 0 0 0 2px var(--cds-support-error);
  background:color-mix(in srgb,var(--cds-support-error) 12%,var(--cds-layer-02))}
.opt--wrong .opt__mark{color:var(--cds-support-error)}
.opt--sel{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-tint)}
/* Carbon inline notification */
[data-theme="g100"] .feedback{box-shadow:inset 0 0 0 1px var(--cds-border-subtle-01)}
.feedback{margin:var(--sp-05) 0;padding:var(--sp-05) var(--sp-06);border-radius:var(--cds-radius);
  display:flex;align-items:flex-start;gap:var(--sp-04);font-size:var(--fs-compact);line-height:1.5}
.feedback .cds-icon{width:1.4rem;height:1.4rem;margin-top:1px}
.feedback b{display:block;margin-bottom:var(--sp-02)}
.feedback--ok{background:var(--cds-notif-success-bg);border-left:3px solid var(--cds-support-success)}
.feedback--ok .cds-icon{color:var(--cds-support-success)}
.feedback--no{background:var(--cds-notif-error-bg);border-left:3px solid var(--cds-support-error)}
.feedback--no .cds-icon{color:var(--cds-support-error)}
.feedback--info{background:var(--cds-notif-info-bg);border-left:3px solid var(--cds-support-info)}
.feedback--info .cds-icon{color:var(--cds-support-info)}
/* eşleştirme */
.match{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-05);margin:var(--sp-05) 0}
.match__col{display:flex;flex-direction:column;gap:var(--sp-04)}
.match__col h3{font-size:var(--fs-label);color:var(--cds-text-secondary);margin:0 0 var(--sp-02);text-transform:uppercase;letter-spacing:.03em}
/* flashcard */
.flash{display:flex;flex-direction:column;align-items:center;gap:var(--sp-05);margin:var(--sp-06) 0}
.card{width:100%;max-width:540px;min-height:180px;border-radius:var(--cds-radius);background:var(--accent-tint);
  box-shadow:inset 0 0 0 2px var(--accent);display:flex;align-items:center;justify-content:center;text-align:center;
  padding:var(--sp-07);font-size:var(--fs-h-sub);font-weight:600;color:var(--accent-strong)}
.card--back{background:var(--cds-layer-02);box-shadow:inset 0 0 0 1px var(--cds-border-subtle);color:var(--cds-text-primary);font-weight:400;font-size:var(--fs-body)}
/* boşluk doldurma */
.cloze{font-size:var(--fs-body);line-height:2;margin:var(--sp-05) 0}
.blank{display:inline-block;min-width:96px;border-bottom:2px solid var(--accent);text-align:center;font-weight:600;color:var(--accent-strong);padding:0 var(--sp-03)}
.pool{display:flex;flex-wrap:wrap;gap:var(--sp-04);margin:var(--sp-05) 0}
.chip-btn{font-family:var(--font-sans);font-size:var(--fs-compact);min-height:var(--tap);padding:0 var(--sp-05);
  border-radius:var(--radius-btn);cursor:pointer;background:var(--cds-layer-02);box-shadow:inset 0 0 0 1px var(--cds-border-strong);color:var(--cds-text-primary)}
.chip-btn:hover:not([disabled]){background:var(--accent-tint);box-shadow:inset 0 0 0 2px var(--accent)}
.chip-btn:focus-visible{outline:2px solid var(--cds-focus);outline-offset:2px}
.chip-btn[disabled]{opacity:.4;cursor:default}
/* soluk-çözümlü örnek (worked, fading worked example) — math g=0.48, fading en güçlü
   alt-özellik (Barbieri 2023); katman+inset kenarlık, gölge yok (G-CARBON-GRID) */
.worked-steps{list-style:none;margin:var(--sp-05) 0;padding:0;display:flex;flex-direction:column;gap:var(--sp-04)}
.worked-step{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-04) var(--sp-05);
  background:var(--cds-layer-02);border-radius:var(--cds-radius);padding:var(--sp-05) var(--sp-06);
  box-shadow:inset 0 0 0 1px var(--cds-border-tile)}
.worked-step__num{flex:none;width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:.8rem;
  background:var(--accent-tint);color:var(--accent-strong)}
.worked-step--solved .worked-step__num{background:transparent;color:var(--cds-text-secondary);
  box-shadow:inset 0 0 0 1.5px var(--cds-border-strong)}
.worked-step__text{flex:1 1 160px;font-size:var(--fs-body);color:var(--cds-text-primary)}
.worked-step--solved .worked-step__text{color:var(--cds-text-secondary)}
.worked-step__field{display:flex;align-items:center;gap:var(--sp-03);flex:none}
.worked-input{font-family:var(--font-sans);font-size:var(--fs-body);font-variant-numeric:tabular-nums;
  min-height:var(--tap);width:140px;padding:0 var(--sp-05);border-radius:var(--radius-btn);
  background:var(--cds-field-01);color:var(--cds-text-primary);
  box-shadow:inset 0 0 0 1px var(--cds-border-strong);
  transition:box-shadow var(--dur-fast) var(--ease-std)}
.worked-input:focus-visible{outline:2px solid var(--cds-focus);outline-offset:2px}
.worked-input[disabled]{opacity:.75;cursor:default}
.worked-mark{flex:none;width:1.4rem;height:1.4rem;display:inline-flex;align-items:center;justify-content:center;color:var(--cds-text-secondary)}
.worked-step--correct{box-shadow:inset 0 0 0 2px var(--cds-support-success);
  background:color-mix(in srgb,var(--cds-support-success) 14%,var(--cds-layer-02))}
.worked-step--correct .worked-mark{color:var(--cds-support-success)}
.worked-step--wrong .worked-input{box-shadow:inset 0 0 0 2px var(--cds-support-error)}
.worked-step--wrong .worked-mark{color:var(--cds-support-error)}
.worked-check{margin-top:var(--sp-05)}
/* merak-boşluğu (hook) — segment içinde kapanan kanca; katman+kenarlık, gölge yok */
.hook-card{margin:var(--sp-06) 0;padding:var(--sp-06) var(--sp-07);border-radius:var(--cds-radius);
  background:var(--accent-tint);border-left:4px solid var(--accent)}
.hook-q{display:flex;align-items:flex-start;gap:var(--sp-04);margin:0 0 var(--sp-04);
  font-size:var(--fs-h-sub);font-weight:600;color:var(--cds-text-primary);line-height:1.35}
.hook-q .cds-icon{color:var(--accent-strong);flex:none;margin-top:2px;width:1.3rem;height:1.3rem}
.hook-predict{display:flex;flex-wrap:wrap;gap:var(--sp-04);margin:var(--sp-05) 0}
.hook-opt{font-family:var(--font-sans);font-size:var(--fs-compact);font-weight:500;min-height:var(--tap);
  padding:0 var(--sp-06);border-radius:99px;cursor:pointer;background:var(--cds-layer-01);
  box-shadow:inset 0 0 0 1px var(--cds-border-strong);color:var(--cds-text-primary);
  transition:box-shadow var(--dur-fast) var(--ease-std),background var(--dur-fast) var(--ease-std)}
.hook-opt:hover{box-shadow:inset 0 0 0 2px var(--accent);background:var(--cds-layer-02)}
.hook-opt:focus-visible{outline:2px solid var(--cds-focus);outline-offset:2px}
.hook-opt--pick{box-shadow:inset 0 0 0 2px var(--accent);background:var(--cds-layer-02);
  color:var(--accent-strong);font-weight:600}
.hook-note{margin:var(--sp-05) 0 0;font-size:var(--fs-label);color:var(--cds-text-secondary)}
.hook-hint{display:flex;align-items:flex-start;gap:var(--sp-03);margin:var(--sp-04) 0 0;
  font-size:var(--fs-label);color:var(--cds-text-secondary);background:var(--cds-layer-02);
  border-radius:var(--cds-radius);padding:var(--sp-03) var(--sp-05)}
.hook-hint .cds-icon{color:var(--accent-strong);flex:none;margin-top:1px;width:1.1rem;height:1.1rem}
.hook-hint[hidden]{display:none}
/* öz-açıklama (selfExplain) — düşük-baskı metakognisyon: serbest/notsuz taslak + kendi
   isteğiyle model karşılaştırma; puanlama yok, ilerleme asla bloklanmaz (G-WELLBEING).
   Katman + inset kenarlık / tint zemin, gölge yok (G-CARBON-GRID) */
.se-prompt{display:flex;align-items:flex-start;gap:var(--sp-04);margin:0 0 var(--sp-04);
  font-size:var(--fs-h-sub);font-weight:600;color:var(--cds-text-primary);line-height:1.35}
.se-prompt .cds-icon{color:var(--accent-strong);flex:none;margin-top:2px;width:1.3rem;height:1.3rem}
.se-field{margin:var(--sp-05) 0}
.se-field__lbl{font-size:var(--fs-label);color:var(--cds-text-secondary);margin:0 0 var(--sp-03)}
.se-optional{color:var(--cds-text-helper)}
.se-textarea{display:block;width:100%;font-family:var(--font-sans);font-size:var(--fs-body);
  color:var(--cds-text-primary);background:var(--cds-field-01);border-radius:var(--cds-radius);
  padding:var(--sp-05);resize:vertical;min-height:7.5rem;box-shadow:inset 0 0 0 1px var(--cds-border-strong);
  transition:box-shadow var(--dur-fast) var(--ease-std)}
.se-textarea:focus-visible{outline:2px solid var(--cds-focus);outline-offset:2px}
.se-textarea::placeholder{color:var(--cds-text-placeholder)}
.se-reveal{margin:var(--sp-05) 0}
.se-reveal[aria-expanded="true"]{background:var(--accent-tint);color:var(--accent-strong)}
.se-model{margin-top:var(--sp-05);padding:var(--sp-06) var(--sp-07);border-radius:var(--cds-radius);
  background:var(--accent-tint);border-left:4px solid var(--accent)}
.se-model[hidden]{display:none}
.se-model__lbl{display:flex;align-items:center;gap:var(--sp-03);margin:0 0 var(--sp-04);
  font-size:var(--fs-label);font-weight:600;color:var(--accent-strong)}
.se-model__lbl .cds-icon{width:1.1rem;height:1.1rem}
.se-model__body{font-size:var(--fs-body);color:var(--cds-text-primary);line-height:1.6}
/* mola */
.break{text-align:center;padding:var(--sp-08) var(--sp-05)}
.break .pic,.break .cds-icon{color:var(--accent-strong);margin-bottom:var(--sp-05);width:72px;height:72px}
.break h2{font-size:var(--fs-h-seg);font-weight:600;margin:0 0 var(--sp-04)}
.break p{font-size:var(--fs-h-sub);font-weight:500;margin:0 0 var(--sp-06)}
.countdown{font-family:var(--font-mono);font-size:var(--fs-display);color:var(--accent-strong);margin-bottom:var(--sp-06)}
/* özet + donut */
.summary{text-align:center;padding:var(--sp-06) var(--sp-05)}
.summary>.pic{color:var(--accent-strong);margin-bottom:var(--sp-05);width:80px;height:80px}
.summary h2{font-size:var(--fs-display);font-weight:600;margin:0 0 var(--sp-05);font-family:var(--font-serif)}
.summary__row{display:flex;align-items:center;justify-content:center;gap:var(--sp-08);flex-wrap:wrap;margin:var(--sp-06) 0}
.objectives{margin:0 0 var(--sp-06);padding:var(--sp-05) var(--sp-06);text-align:left;
  background:var(--cds-layer-02);border-left:4px solid var(--accent);border-radius:var(--cds-radius)}
.objectives h3{font-size:var(--fs-h-sub);font-weight:600;margin:0 0 var(--sp-04)}
.objectives ul{margin:0;padding-left:1.35em}
.objectives li{margin:0 0 var(--sp-03)}
.objectives li:last-child{margin-bottom:0}
.donut{position:relative;width:160px;height:160px;flex:none}
.donut svg{transform:rotate(-90deg)}
.donut__center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut__pct{font-family:var(--font-mono);font-size:2rem;font-weight:600;color:var(--cds-text-primary)}
.donut__lbl{font-size:var(--fs-label);color:var(--cds-text-secondary)}
.stat-col{display:flex;flex-direction:column;gap:var(--sp-04)}
.stat{background:var(--cds-layer-02);border:1px solid var(--cds-border-subtle);border-radius:var(--cds-radius);
  padding:var(--sp-05) var(--sp-06);min-width:160px;text-align:left;display:flex;align-items:center;gap:var(--sp-04)}
.stat .pic,.stat .cds-icon{color:var(--accent-strong);width:1.6rem;height:1.6rem}
.stat__num{font-family:var(--font-mono);font-size:1.5rem;font-weight:600;color:var(--cds-text-primary)}
.stat__lbl{font-size:var(--fs-label);color:var(--cds-text-secondary)}
.self-assess{text-align:left;max-width:540px;margin:var(--sp-06) auto;background:var(--accent-tint);border-radius:var(--cds-radius);padding:var(--sp-06)}
.self-assess h3{font-size:var(--fs-h-sub);margin:0 0 var(--sp-05);color:var(--cds-text-primary)}
.check-row{display:flex;align-items:center;gap:var(--sp-04);margin-bottom:var(--sp-04);font-size:var(--fs-compact);cursor:pointer;color:var(--cds-text-primary)}
.check-row input{width:22px;height:22px;accent-color:var(--accent);cursor:pointer}
/* alt yönlendirme */
.nav{display:flex;justify-content:space-between;gap:var(--sp-05);margin-top:var(--sp-05);
  padding-top:var(--sp-05);flex-wrap:wrap;min-width:0;max-width:100%}
.nav .btn{min-width:0;max-width:100%}
.streak{display:inline-flex;align-items:center;gap:6px;width:fit-content;
  font-family:var(--font-sans);font-size:.8125rem;font-weight:500;
  color:var(--cds-text-secondary);background:var(--cds-layer-01);
  border:1px solid var(--cds-border-subtle);
  border-radius:99px;padding:3px var(--sp-04);margin-bottom:var(--sp-05)}
.streak b{font-family:var(--font-mono);color:var(--cds-text-primary);font-weight:600;font-variant-numeric:tabular-nums}
.q-stem{font-size:var(--fs-h-sub);font-weight:600;margin:0 0 var(--sp-05);color:var(--cds-text-primary);line-height:1.3}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
/* zaman çizelgesi (display materyali) */
.timeline{list-style:none;margin:var(--sp-05) 0;padding:0;position:relative}
.tl-item{display:flex;gap:var(--sp-05);padding-bottom:var(--sp-06);position:relative}
.tl-item:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:0;width:2px;background:var(--cds-border-subtle)}
.tl-node{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent-tint);color:var(--accent-strong);
  display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;
  box-shadow:inset 0 0 0 2px var(--accent);z-index:1}
.tl-card{background:var(--cds-layer-02);border:1px solid var(--cds-border-subtle);border-radius:var(--cds-radius);padding:var(--sp-05) var(--sp-06);flex:1}
.tl-when{font-family:var(--font-mono);font-size:var(--fs-label);color:var(--accent-strong);font-weight:600}
.tl-label{font-weight:600;margin:2px 0}
.tl-detail{font-size:var(--fs-compact);color:var(--cds-text-secondary)}
/* hotspot */
.hotspot-wrap [data-spot]{cursor:pointer}
.hotspot-wrap [data-spot]:focus-visible{outline:2px solid var(--cds-focus);outline-offset:2px}
.flash .btn{min-width:160px}
/* yeniden kullanılabilir çağrı kutusu (Carbon aside/notification deseni) */
.callout{margin:var(--sp-05) 0;padding:var(--sp-05) var(--sp-06);border-radius:var(--cds-radius);
  border-left:4px solid var(--accent);background:var(--accent-tint);display:flex;gap:var(--sp-04);align-items:flex-start}
.callout .cds-icon{color:var(--accent-strong);flex:none;margin-top:3px;width:1.3rem;height:1.3rem}
.callout--info{border-color:var(--cds-support-info);background:var(--cds-notif-info-bg)}
.callout--info .cds-icon{color:var(--cds-support-info)}
.callout--success{border-color:var(--cds-support-success);background:var(--cds-notif-success-bg)}
.callout--success .cds-icon{color:var(--cds-support-success)}
.callout--warning{border-color:var(--cds-support-warning);background:var(--cds-notif-warning-bg)}
.callout--warning .cds-icon{color:var(--reward)}
.callout__t{font-weight:600;display:block;margin-bottom:2px}
.callout p{margin:0}
/* v3.0.0 — Task 17: parametrik simülasyon (sanal manipülatif). Kaydırıcı satırları
   + SVG kanvası (.visual paylaşılan kutuyu miras alır). SVG'nin kendisi motorda
   svg.innerHTML TAM değişimiyle güncellenir (bkz. renderSim/SIM_PRESETS) — bu
   yüzden burada KASITLI olarak hiçbir transition/animasyon kuralı YOK (yeniden
   çizim mimari olarak her zaman anında, reduced-motion'dan bağımsız). */
.sim-controls{display:flex;flex-direction:column;gap:var(--sp-05);margin:var(--sp-05) 0}
.sim-param{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-04);
  background:var(--cds-layer-02);border-radius:var(--cds-radius);
  padding:var(--sp-04) var(--sp-05);box-shadow:inset 0 0 0 1px var(--cds-border-tile)}
.sim-param__lbl{flex:1 1 160px;font-size:var(--fs-compact);font-weight:500;color:var(--cds-text-primary)}
.sim-param input[type="range"]{flex:2 1 200px;accent-color:var(--accent);cursor:pointer}
.sim-param input[type="range"]:focus-visible{outline:2px solid var(--cds-focus);outline-offset:2px}
.sim-val{flex:none;min-width:64px;text-align:right;font-family:var(--font-mono);
  font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent-strong)}
/* v3.0.0 — Task 18: kavram haritası kurucu (conceptMap). Düğümler gerçek <button>
   (DOM katmanı, absolute + yüzde-konum); kenarlar SALT GÖRSEL bir SVG çizgi
   katmanında (aria-hidden — erişilebilir kayıt aşağıdaki metin listesidir, çift-
   temsil karmaşası yaratmamak için) + klavye-erişilebilir "kaldır" düğmesi taşıyan
   bir metin listesinde gösterilir. .cmap-field'ın aspect-ratio:3/2'si SVG viewBox
   (0 0 600 400, aynı 3:2 oran) ile kilitli tutulur ki düğüm yüzde-konumları ve SVG
   çizgi uç noktaları her zaman hizalı kalsın. Gölge yok (yalnız inset — G-CARBON-GRID). */
.cmap-field{position:relative;aspect-ratio:3/2;margin:var(--sp-05) 0;
  background:var(--cds-layer-02);border:1px solid var(--cds-border-subtle);
  border-radius:var(--cds-radius);overflow:hidden}
.cmap-lines{position:absolute;inset:0;width:100%;height:100%}
.cmap-line{stroke:var(--cds-border-strong);stroke-width:2.5}
.cmap-line--correct{stroke:var(--cds-support-success)}
.cmap-line--extra{stroke:var(--cds-support-info)}
.cmap-node{position:absolute;transform:translate(-50%,-50%);max-width:136px;
  font-family:var(--font-sans);font-size:var(--fs-label);font-weight:600;text-align:center;
  min-height:var(--tap);padding:var(--sp-03) var(--sp-05);border-radius:var(--cds-radius);
  cursor:pointer;background:var(--cds-layer-01);color:var(--cds-text-primary);
  box-shadow:inset 0 0 0 1.5px var(--cds-border-strong);
  transition:box-shadow var(--dur-fast) var(--ease-std),background var(--dur-fast) var(--ease-std)}
.cmap-node:hover:not([disabled]){box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-tint)}
.cmap-node:focus-visible{outline:2px solid var(--cds-focus);outline-offset:2px}
.cmap-node--sel{box-shadow:inset 0 0 0 2.5px var(--accent);background:var(--accent-tint);color:var(--accent-strong)}
.cmap-node[disabled]{cursor:default;opacity:.85}
.cmap-edges{margin:var(--sp-05) 0}
.cmap-edges__lbl{font-size:var(--fs-label);color:var(--cds-text-secondary);font-weight:600;
  text-transform:uppercase;letter-spacing:.03em;margin:0 0 var(--sp-03)}
.cmap-edges__empty{font-size:var(--fs-compact);color:var(--cds-text-helper);margin:0 0 var(--sp-04)}
.cmap-edges__empty[hidden]{display:none}
.cmap-edges__list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--sp-03)}
.cmap-edge{display:flex;align-items:center;gap:var(--sp-04);background:var(--cds-layer-02);
  border-radius:var(--radius-btn);padding:var(--sp-03) var(--sp-04);
  box-shadow:inset 0 0 0 1px var(--cds-border-tile)}
.cmap-edge__mark{flex:none;width:1.2rem;height:1.2rem;display:inline-flex;align-items:center;justify-content:center;color:var(--cds-text-secondary)}
.cmap-edge__mark:empty::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cds-border-strong)}
.cmap-edge--correct{box-shadow:inset 0 0 0 1.5px var(--cds-support-success)}
.cmap-edge--correct .cmap-edge__mark{color:var(--cds-support-success)}
.cmap-edge--extra{box-shadow:inset 0 0 0 1.5px var(--cds-support-info)}
.cmap-edge--extra .cmap-edge__mark{color:var(--cds-support-info)}
.cmap-edge__text{flex:1;font-size:var(--fs-compact);color:var(--cds-text-primary)}
.cmap-edge__remove{flex:none;width:40px;height:40px;border:none;background:transparent;cursor:pointer;
  color:var(--cds-icon-secondary);display:inline-flex;align-items:center;justify-content:center;border-radius:8px;
  transition:background var(--dur-fast) var(--ease-std)}
.cmap-edge__remove:hover:not([disabled]){background:var(--cds-background-hover);color:var(--cds-support-error)}
.cmap-edge__remove:focus-visible{outline:2px solid var(--cds-focus);outline-offset:2px}
.cmap-edge__remove[disabled]{opacity:.4;cursor:default}
.cmap-edge__remove .cds-icon{width:1rem;height:1rem}
.cmap-check{margin:var(--sp-05) 0}
/* ===== işlevsel renk: etkinlik-tipine göre wayfinding aksanı (signaling) ===== */
.stage[data-seg="teach"]{--seg-accent:var(--cds-support-info)}
.stage[data-seg="mcq"],.stage[data-seg="checkpoint"],.stage[data-seg="fillblank"],.stage[data-seg="match"],.stage[data-seg="order"],.stage[data-seg="sorting"],.stage[data-seg="hotspot"],.stage[data-seg="conceptMap"]{--seg-accent:var(--accent)}
.stage[data-seg="brainbreak"]{--seg-accent:var(--cds-support-success)}
.stage[data-seg="chart"],.stage[data-seg="table"]{--seg-accent:var(--viz-2)}
.stage[data-seg="flashcards"]{--seg-accent:var(--accent)}
.seg-ic{background:color-mix(in srgb,var(--seg-accent,var(--accent)) 16%,transparent)}
.seg-ic .pic{color:var(--seg-accent,var(--accent-strong))}
.kicker{color:var(--seg-accent,var(--accent-strong))}
.seg-head{border-bottom-color:color-mix(in srgb,var(--seg-accent,var(--cds-border-subtle)) 38%,var(--cds-border-subtle))}
/* ===== ödül/ilerleme: pozitif sıcak vurgu (XP, yıldız) ===== */
.xp .cds-icon{color:var(--reward)}
.stat--xp .stat__num{color:var(--reward)}
.stat--xp .cds-icon{color:var(--reward)}
/* ===== Carbon DataTable (anlamsal tablo) ===== */
.viz-table-wrap{margin:var(--sp-06) 0;overflow-x:auto;border:1px solid var(--cds-border-subtle);border-radius:var(--cds-radius)}
table.viz-table{border-collapse:collapse;width:100%;font-size:var(--fs-compact);background:var(--cds-layer-02)}
table.viz-table caption{caption-side:top;text-align:left;font-size:var(--fs-label);color:var(--cds-text-secondary);padding:var(--sp-05) var(--sp-05) var(--sp-04)}
.viz-table thead th{background:var(--cds-layer-accent-01);color:var(--cds-text-primary);font-weight:600;text-align:left;
  padding:var(--sp-04) var(--sp-05);border-bottom:1px solid var(--cds-border-strong);white-space:nowrap}
.viz-table tbody th[scope="row"]{font-weight:600}
.viz-table td,.viz-table tbody th{padding:var(--sp-04) var(--sp-05);border-bottom:1px solid var(--cds-border-subtle);color:var(--cds-text-primary);text-align:left}
.viz-table tbody tr:nth-child(odd){background:var(--cds-layer-01)}
.viz-table tbody tr:last-child td,.viz-table tbody tr:last-child th{border-bottom:none}
.viz-table .num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.viz-table .hi{color:var(--seg-accent,var(--accent-strong));font-weight:600}
/* ===== matematik dizgisi (sayı/sembol mükemmelliği) ===== */
.math{font-family:var(--font-serif);font-variant-numeric:lining-nums tabular-nums;line-height:1.5}
.math.block{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.06em .16em;font-size:1.4rem;line-height:1.2;margin:var(--sp-05) 0}
.math .frac{display:inline-flex;flex-direction:column;text-align:center;margin:0 .12em;line-height:1.15}
.math:not(.block) .frac{vertical-align:middle}
.math .frac>.num{border-bottom:1.5px solid currentColor;padding:0 .35em}
.math .frac>.den{padding:0 .35em}
.math sup,.math sub{font-size:.72em;font-family:var(--font-serif)}
.math .rad{border-top:1.5px solid currentColor;padding:0 .15em;margin-left:-.05em}
.math .op{padding:0 .1em;color:var(--cds-text-secondary)}
[data-subject="math"] .viz text{font-variant-numeric:lining-nums tabular-nums}
/* ===== derse-özel görsel güçler ===== */
.viz--plain{text-align:left}
/* etiketli diyagram: numaralı iğneler + sıralı açıklama listesi (Fen/Coğrafya) */
.viz .pin{fill:var(--accent)}
.viz .pin-n{fill:var(--cds-text-on-color);font-weight:700}
.viz-legend-list{margin:var(--sp-05) 0 0;padding-left:1.4rem;display:grid;gap:var(--sp-03);
  font-size:var(--fs-compact);color:var(--cds-text-primary)}
.viz-legend-list li::marker{color:var(--accent-strong);font-weight:700}
/* ilişki akışı: sebep-sonuç / kavram zinciri (Sosyal/Yurttaşlık) */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:var(--sp-04)}
.flow-node{flex:1 1 140px;min-width:120px;background:var(--cds-layer-02);
  border:1px solid var(--cds-border-subtle);border-left:4px solid var(--seg-accent,var(--accent));
  border-radius:var(--cds-radius);padding:var(--sp-05)}
.flow-node__t{font-weight:600}
.flow-node__s{font-size:var(--fs-label);color:var(--cds-text-secondary);margin-top:2px}
.flow-arrow{display:flex;align-items:center;color:var(--seg-accent,var(--accent));flex:none}
.flow-arrow .cds-icon{width:1.4rem;height:1.4rem}
@media (max-width:560px){ .flow{flex-direction:column} .flow-arrow{transform:rotate(90deg);align-self:center} }
/* kavram/değer kartları (Din/Yurttaşlık/genel) */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--sp-05)}
.cards--2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.cards--4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:var(--cds-layer-02);border:1px solid var(--cds-border-subtle);
  border-top:3px solid var(--seg-accent,var(--accent));border-radius:var(--cds-radius);padding:var(--sp-06)}
.card .pic{width:30px;height:30px;color:var(--seg-accent,var(--accent-strong));margin-bottom:var(--sp-04)}
.card__t{font-size:var(--fs-h-sub);font-weight:600;margin:0 0 var(--sp-03)}
.card__d{margin:0;color:var(--cds-text-secondary);font-size:var(--fs-compact)}
/* dil: satır-arası çözümleme; rol/cinsiyet renk-kodu DAİMA etiketle birlikte (CVD-güvenli) */
.gloss{display:flex;flex-wrap:wrap;gap:var(--sp-04) var(--sp-05);align-items:flex-end;font-size:1.2rem;padding:var(--sp-04) 0}
.tok{display:inline-flex;flex-direction:column;align-items:center;gap:3px}
.tok .w{font-weight:600;padding-bottom:3px;border-bottom:3px solid transparent}
.tok .tg{font-size:.72rem;font-weight:600;color:var(--cds-text-secondary);text-transform:uppercase;letter-spacing:.02em}
.tok[data-role="masc"] .w{border-bottom-color:var(--viz-1)}
.tok[data-role="fem"] .w{border-bottom-color:var(--viz-3)}
.tok[data-role="verb"] .w{border-bottom-color:var(--viz-2)}
.tok[data-role="noun"] .w{border-bottom-color:var(--viz-4)}
.tok[data-role="adj"] .w{border-bottom-color:var(--viz-5)}
.tok[data-role="art"] .w{border-bottom-color:var(--accent)}
.gloss-tr{margin:var(--sp-04) 0 0;color:var(--cds-text-secondary);font-family:var(--font-serif);font-style:italic}
/* dil: iki konuşmacılı diyalog */
.dialogue{display:flex;flex-direction:column;gap:var(--sp-05)}
.turn{max-width:85%;display:flex;flex-direction:column;gap:2px}
.turn--a{align-self:flex-start}
.turn--b{align-self:flex-end;text-align:right}
.turn__sp{font-size:var(--fs-label);font-weight:600;color:var(--cds-text-secondary)}
.turn__b{background:var(--cds-layer-02);border:1px solid var(--cds-border-subtle);border-radius:var(--cds-radius);padding:var(--sp-04) var(--sp-05)}
.turn--b .turn__b{background:var(--accent-tint);border-color:transparent}
.turn__g{display:block;margin-top:3px;font-size:var(--fs-label);color:var(--cds-text-secondary)}
/* oyunlaştırma görsel geri bildirimi (earcon ile eşli; hareket-açık modda) */
.xp{position:relative}
.xp-float{position:absolute;right:0;top:-2px;font-size:var(--fs-label);font-weight:700;color:var(--reward);pointer-events:none;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){
  @keyframes xpRise{0%{opacity:0;transform:translateY(4px)}20%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
  .xp-float{animation:xpRise 1.05s var(--ease-exit) forwards}
  @keyframes xpPulse{0%,100%{transform:scale(1)}40%{transform:scale(1.14)}}
  .xp.pulse{animation:xpPulse var(--cds-duration-slow-01) var(--ease-expr)}
  @keyframes badgePop{0%{transform:scale(.6);opacity:.2}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  .badge--new{animation:badgePop .45s var(--ease-entrance)}
}
#wellbeing:empty{display:none}
#wellbeing{margin:0 0 var(--sp-05)}
/* segment türüne göre yüzey ritmi — tek-düzeliği kıran anlamlı mod ipuçları */
.stage[data-seg="brainbreak"]{background:var(--accent-tint)}
.stage[data-seg="checkpoint"]{border-top:4px solid var(--accent)}
.stage[data-seg="summary"]{background:linear-gradient(180deg,var(--accent-tint) 0,var(--cds-layer-01) 160px)}
@media (max-width:560px){
  .stage{padding:var(--sp-06) var(--sp-05)}
  .match{grid-template-columns:1fr}
  :root{--fs-display:2rem;--fs-h-seg:1.5rem}
}
@media (max-width:400px){
  .wrap{padding:var(--sp-03)}
  .topbar__hero,.topbar__status{padding:var(--sp-04)}
  .topbar__l,.topbar__r{flex-basis:100%;width:100%}
  .topbar__r{justify-content:space-between}
  .topbar__tools{margin-left:auto;padding-left:var(--sp-02)}
  .stage{padding:var(--sp-05) var(--sp-04)}
  .seg-head{align-items:flex-start;gap:var(--sp-04)}
  .seg-ic{width:48px;height:48px;border-radius:12px}
  .opt,.worked-step,.sim-param{padding:var(--sp-04)}
  .worked-step__field,.worked-input{width:100%;min-width:0}
  .nav .btn{flex:1 1 100%;padding-inline:var(--sp-04)}
}
/* ===== v1.8.0 — flashcard ipucu bloğu (ayrı, ortalanmış; satır-içi çakışma giderildi) ===== */
.fc-back{display:flex;flex-direction:column;align-items:center;gap:var(--sp-05);width:100%}
.fc-back__def{font-size:var(--fs-body);text-align:center;color:var(--cds-text-primary)}
.fc-hint{display:inline-flex;align-items:flex-start;gap:var(--sp-03);justify-content:center;text-align:left;
  font-size:var(--fs-label);color:var(--cds-text-secondary);background:var(--accent-tint);
  border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);border-radius:var(--cds-radius);
  padding:var(--sp-03) var(--sp-05);max-width:92%}
.fc-hint .cds-icon{color:var(--accent-strong);flex:none;margin-top:2px;width:1.1rem;height:1.1rem}
.fc-hint b{color:var(--cds-text-primary);font-weight:600}
/* ===== v1.8.0 — kesir/oran çubuğu (bar modeli; daire değil) ===== */
.fraction-bar{width:100%;max-width:560px}
.fraction-bar .fb-eq{fill:var(--cds-text-primary);font-family:var(--font-serif);
  font-variant-numeric:lining-nums tabular-nums;font-weight:600}
.fraction-bar .fb-cap{fill:var(--cds-text-secondary);font-family:var(--font-sans)}
/* ===== v1.8.0 — seri/combo göstergesi (üst çubuk çipi) ===== */
.streak-chip{position:relative;font-family:var(--font-sans);font-weight:600;display:inline-flex;align-items:center;
  gap:var(--sp-03);background:var(--reward-bg);color:var(--cds-text-primary);border-radius:99px;
  padding:var(--sp-03) var(--sp-05);white-space:nowrap}
.streak-chip[hidden]{display:none}
/* v3.0.0 — gain-only: yanlış cevaptan sonra sıfırlanmaz, yalnız nötr "korundu" görünümü (opacity; ceza dili yok) */
.streak-chip[data-held="true"]{opacity:.6}
.streak-chip .cds-icon{color:var(--reward);width:1.1rem;height:1.1rem}
.streak-chip__n{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.streak-float{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-family:var(--font-sans);
  font-size:var(--fs-label);font-weight:700;color:var(--reward);white-space:nowrap;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  @keyframes streakHit{0%,100%{transform:scale(1)}35%{transform:scale(1.18)}}
  .streak-chip--hit{animation:streakHit .6s var(--ease-expr)}
  .streak-float{animation:xpRise 1.15s var(--ease-exit) forwards}
}
/* ===== v1.8.0 — sesli oku (TTS) kontrolleri ===== */
.icon-btn--on{background:var(--accent-tint);color:var(--accent-strong)}
.icon-btn--on .cds-icon{color:var(--accent-strong)}
.tts-row{margin:var(--sp-04) 0 0}
[data-tts="off"] .tts-row{display:none}
.tts-oku{display:none;align-items:center;gap:var(--sp-03);font-family:var(--font-sans);font-size:var(--fs-label);
  min-height:36px;padding:0 var(--sp-05);border:none;border-radius:var(--radius-btn);cursor:pointer;
  background:var(--cds-layer-02);box-shadow:inset 0 0 0 1px var(--cds-border-strong);color:var(--cds-text-primary)}
[data-tts="on"] .tts-oku{display:inline-flex}
.tts-oku:hover{background:var(--accent-tint);box-shadow:inset 0 0 0 1px var(--accent)}
.tts-oku:focus-visible{outline:2px solid var(--cds-focus);outline-offset:2px}
.tts-oku .cds-icon{width:1.05rem;height:1.05rem;color:var(--accent-strong)}
.tts-oku--on{background:var(--accent-tint);box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent-strong)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>

  // v1.8.0 — seri kilometre taşları (Fibonacci ritmi) ve TTS yetenek bayrağı

  /* ---- ses (Web Audio earcon) + oyunlaştırma görsel yardımcıları ----
     İlke: kısa, hoş-değerlikli, düşük sesli, GÖRSELLE eşli, opsiyonel/susturulabilir;
     sürekli müzik/gürültü YOK; reduced-motion ise varsayılan KAPALI. */
  const AudioFX=(function(){
    let ctx=null;
    function ac(){ if(ctx) return ctx; const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; try{ctx=new C();}catch(e){ctx=null;} return ctx; }
    function tone(c,freq,t0,dur,peak,type){
      const o=c.createOscillator(), g=c.createGain();
      o.type=type||"sine"; o.frequency.setValueAtTime(freq,t0);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(peak,t0+0.014);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0+dur+0.03);
    }
    // pozitif-değerlikli, kısa motifler (sert/alçak-değerlikli ses yok)
    const SEQ={
      correct:[[659.25,0,0.13,0.10,"sine"],[987.77,0.10,0.16,0.10,"sine"]],
      retry:[[311.13,0,0.20,0.06,"sine"]],
      reward:[[659.25,0,0.12,0.10,"triangle"],[830.61,0.10,0.12,0.10,"triangle"],[1244.51,0.20,0.24,0.11,"triangle"]],
      notify:[[880,0,0.16,0.08,"sine"],[1318.51,0.12,0.22,0.07,"sine"]]
    };
    return { play:function(name){
      if(!state.sound) return;
      const c=ac(); if(!c) return;
      if(c.state==="suspended"){ try{c.resume();}catch(e){} }
      const seq=SEQ[name]; if(!seq) return;
      const t=c.currentTime+0.01;
      seq.forEach(function(x){ tone(c,x[0],t+x[1],x[2],x[3],x[4]); });
    }};
  })();
  function playSound(name){ try{ AudioFX.play(name); }catch(e){} }
  function toggleSound(){
    state.sound=!state.sound;
    const b=$("#soundBtn");
    if(b){ b.setAttribute("aria-label", state.sound?"Sesi kapat":"Sesi aç");

  function xpFloat(n,anchor){

  /* ---- v3.0.0 — Task 13: görünmez, taban-korumalı uyarlanır zorluk (mcq/fillblank).
     gamified-flows.md §2.3/§3.3'ün motor tezahürü. state.perf: son PERF_WINDOW
     gözlemin yuvarlanan penceresi (true=ilk denemede doğru, false=en az bir
     yanlıştan sonra doğru — "kayıp" değil, yalnızca bir sinyal; her segment
     tipinde, awarded-guard'ı geçen HER soru/öğe için tam bir kez itilir).
     Sondan geriye ardışık aynı-değer sayısı (trailing run) iki sinyal üretir:
     2 ardışık "yanlıştan-sonra-doğru" → ipucu-önce + taban-koruyucu tier
     tercihi (soru zorlaşmaz, destek artar); 2 ardışık "ilk-denemede-doğru" →
     opsiyonel "meydan okuma" (öğrencinin kendi seçtiği, dayatılmayan, atlanabilir).
     UYARLAMA KATMANI YALNIZ `tier`'LI SEGMENTLERDE ETKİNDİR (hasTiers muhafızı,
     runQuestionSet/renderFillblank içinde) — hiçbir soruda/öğede `tier` yoksa
     (mevcut modüllerin tamamı) itemTier() her zaman 1 döner, tierAdaptSwap hep
     no-op'tur (aday zaten en düşük tier'da) ve hasTierAhead(...,3) hep false'tur
     (meydan okuma düğmesi hiç render edilmez) — davranış BİREBİR korunur.
     Kullanıcıya görünür hiçbir zorluk-etiketi/duyuru YAZILMAZ (yalnız nötr
     "İpucu" başlıklı mevcut açıklama erken gösterilir) — G-FLOW FLOW_LABEL_RE. */
  const PERF_WINDOW=5;
  function perfPush(hit){ state.perf.push(!!hit); if(state.perf.length>PERF_WINDOW) state.perf.shift(); persistSession(); }
  function perfTrailingRun(val){
    let n=0;
    for(let i=state.perf.length-1;i>=0;i--){ if(state.perf[i]===val) n++; else break; }
    return n;
  }
  function perfMissSignal(){ return perfTrailingRun(false)>=2; }
  function perfChallengeSignal(){ return perfTrailingRun(true)>=2; }
  function itemTier(x){ const t=x&&x.tier; return (t===2||t===3)?t:1; }
  // Kalan sırayı (order[from..]) tier'a göre yeniden düzenler: preferMin=true → en
  // düşük tier'ı `from` konumuna getirir (taban-koruma); preferMin=false → en yüksek
  // tier'ı getirir (meydan okuma). Toplam öğe sayısı ve gradeKey kimliği DEĞİŞMEZ —
  // yalnızca kalan sıradaki konumlar takas edilir (her orijinal indeks tam bir kez
  // gösterilir). Tier'sız kümede (hepsi=1) daima no-op.
  function tierAdaptSwap(order, list, from, preferMin){
    if(from<0||from>=order.length) return false;
    let bestPos=from, bestTier=itemTier(list[order[from]]);
    for(let k=from+1;k<order.length;k++){
      const t=itemTier(list[order[k]]);
      if(preferMin ? (t<bestTier) : (t>bestTier)){ bestTier=t; bestPos=k; }
    }
    if(bestPos===from) return false;
    const tmp=order[from]; order[from]=order[bestPos]; order[bestPos]=tmp;
    return true;
  }
  function hasTierAhead(order, list, from, tierVal){
    for(let k=from;k<order.length;k++){ if(itemTier(list[order[k]])===tierVal) return true; }
    return false;
  }

  /* ---- v3.0.0 — Task 10: kaygısız tempo diski (opsiyonel; varsayılan KAPALI; gamified-flows.md §3.4).
     Sayısız + kesintisiz: sayısal geri-sayım/alarm/hard-stop YOK; disk yalnız ortam ipucudur, bir
     sınır değildir. data-countdown attribute'u KASITLI olarak asla yazılmaz (bkz. G-FLOW kural 3:
     pacing-?[Dd]isk...data-countdown deseni FAIL üretir). ---- */
  function renderPacingDisk(){
    const box=$("#pacingDisk"); if(!box) return;
    if(!(D.learner && D.learner.pacingDisk===true)){ box.hidden=true; return; }
    if(pacingFrame!=null){ cancelAnimationFrame(pacingFrame); pacingFrame=null; }
    const mins=(D.meta&&D.meta.estimatedMinutes)||20;
    const totalMs=Math.max(1,mins)*60000, startedAt=Date.now();
    const arc=box.querySelector(".pacing-disk__arc");
    const r=11, C=2*Math.PI*r;
    arc.setAttribute("stroke-dasharray", C.toFixed(2));
    function paint(){
      const frac=Math.max(0,Math.min(1,(Date.now()-startedAt)/totalMs));
      arc.setAttribute("stroke-dashoffset", (C*frac).toFixed(2));
      return frac;
    }
    box.hidden=false;
    if(reduceMotion()){
      paint(); // tek kare statik disk — requestAnimationFrame YOK (hareket-azaltma saygısı)
    } else {
      (function tick(){
        if(paint()<1 && !box.hidden) pacingFrame=requestAnimationFrame(tick);
        else pacingFrame=null;
      })();
    }
    const dismiss=$("#pacingDiskDismiss");
    if(dismiss) dismiss.addEventListener("click",()=>{
      box.hidden=true;
      if(pacingFrame!=null){ cancelAnimationFrame(pacingFrame); pacingFrame=null; }
    });
  }

  /* ---- v1.8.0: sesli oku (TTS) — opsiyonel, talep-üzerine, varsayılan KAPALI, otomatik-okuma YOK ---- */
  function defLang(){ return (D.meta&&D.meta.ttsLang) || "tr-TR"; }            // öğretim/anlatım dili
  function contentLang(){                                                      // hedef-dil içeriği (gloss/diyalog)
    if(D.meta&&D.meta.ttsLang) return D.meta.ttsLang;

    return k==="french" ? "fr-FR" : (k==="english" ? "en-US" : "tr-TR");
  }
  function stripTags(html){
    var d=document.createElement("div"); d.innerHTML=String(html==null?"":html);
    return (d.textContent||d.innerText||"").replace(/\s+/g," ").trim();
  }
  function ttsBtn(text, lang){
    if(!TTS_OK) return "";
    var clean=stripTags(text); if(!clean) return "";
    return `<button class="tts-oku" type="button" data-speak="${encodeURIComponent(clean)}"`
      +(lang?` data-lang="${lang}"`:"")+` aria-pressed="false">`+icon("ic-headphones")+`<span>Oku</span></button>`;
  }
  function ttsRow(text, lang){ var b=ttsBtn(text,lang); return b?`<div class="tts-row">${b}</div>`:""; }
  var _ttsBtn=null;
  function _ttsClear(btn){
    if(_ttsBtn && _ttsBtn!==btn){ _ttsBtn.classList.remove("tts-oku--on"); _ttsBtn.setAttribute("aria-pressed","false"); }
    _ttsBtn=btn||null;
  }
  function ttsCancel(){ try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){} _ttsClear(null); }
  function speakText(text, lang, btn){
    if(!TTS_OK || !text) return;
    var synth=window.speechSynthesis;
    // aynı düğmeye yeniden basılırsa: durdur (aç/kapa davranışı)
    if(btn && btn===_ttsBtn){ try{synth.cancel();}catch(e){} btn.classList.remove("tts-oku--on"); btn.setAttribute("aria-pressed","false"); _ttsBtn=null; return; }
    try{ synth.cancel(); }catch(e){}
    var u; try{ u=new SpeechSynthesisUtterance(String(text)); }catch(e){ return; }
    u.lang=lang||defLang();
    u.rate=(D.meta&&D.meta.ttsRate)||0.95;   // öğrenenler için hafif yavaş
    u.pitch=1; u.volume=1;
    if(btn){
      _ttsClear(btn); btn.classList.add("tts-oku--on"); btn.setAttribute("aria-pressed","true");
      u.onend=u.onerror=function(){ btn.classList.remove("tts-oku--on"); btn.setAttribute("aria-pressed","false"); if(_ttsBtn===btn) _ttsBtn=null; };
    }
    try{ synth.speak(u); }catch(e){}
  }

  /* ---- Carbon ProgressIndicator (adım göstergesi) ---- */
  function renderStepper(){

    });

    // v3.0.0 — kilometre taşı (bahşedilmiş/hedef-gradyanı) düğümlerini işaretle
    (D.meta.milestones||[]).forEach(m=>{
