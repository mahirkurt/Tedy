  // Fen/Coğrafya: numaralı çağrı-iğneli etiketli diyagram (SVG) + sıralı açıklama listesi.
  function labeledFigure(spec){
    const vb=spec.viewBox||"0 0 480 300", id=vizId(), tid=id+"t", did=id+"d";
    const pins=(spec.labels||[]).map((L,i)=>{
      const n=L.n!=null?L.n:(i+1);
      return `<g><circle class="pin" cx="${L.x}" cy="${L.y}" r="12"/>`
        +`<text class="pin-n" x="${L.x}" y="${L.y}" text-anchor="middle" dominant-baseline="central" font-size="13">${esc(String(n))}</text></g>`;
    }).join("");
    const svg=`<svg class="viz" viewBox="${vb}" role="img" aria-labelledby="${tid} ${did}"><title id="${tid}">${esc(spec.title||"Etiketli şema")}</title><desc id="${did}">${esc(spec.desc||spec.title||"")}</desc>${spec.base||""}${pins}</svg>`;
    const legend=(spec.labels||[]).length
      ? `<ol class="viz-legend-list">${(spec.labels||[]).map(L=>`<li>${esc(L.text||"")}</li>`).join("")}</ol>` : "";
    return `<figure class="viz">${svg}${legend}${spec.caption?`<figcaption>${esc(spec.caption)}</figcaption>`:""}</figure>`;
  }

  // Sosyal/Yurttaşlık: sebep-sonuç / kavram zinciri (HTML grafik düzenleyici).
  function relationFlow(spec){
    const steps=spec.steps||[];
    const nodes=steps.map((st,i)=>{
      const lab=(typeof st==="string")?st:(st.label||"");
      const sub=(typeof st==="object"&&st.sub)?`<div class="flow-node__s">${esc(st.sub)}</div>`:"";
      const tile=`<div class="flow-node"><div class="flow-node__t">${esc(lab)}</div>${sub}</div>`;
      const arrow=i<steps.length-1?`<div class="flow-arrow" aria-hidden="true">${icon("ic-arrow-right")}</div>`:"";
      return tile+arrow;
    }).join("");
    return `<figure class="viz viz--plain"><div class="flow">${nodes}</div>${spec.caption?`<figcaption>${esc(spec.caption)}</figcaption>`:""}</figure>`;
  }

  // Genel/Din/Yurttaşlık: kavram/değer kartları ızgarası (HTML).
  function infoCards(spec){
    const cards=(spec.cards||[]).map(c=>{
      const pic=c.icon?`<svg class="pic" aria-hidden="true" focusable="false"><use href="#${esc(c.icon)}"></use></svg>`:"";
      return `<div class="card">${pic}<h4 class="card__t">${esc(c.term||"")}</h4>${c.desc?`<p class="card__d">${esc(c.desc)}</p>`:""}</div>`;
    }).join("");
    const cls=spec.columns===2?" cards--2":(spec.columns===4?" cards--4":"");
    return `<figure class="viz viz--plain"><div class="cards${cls}">${cards}</div>${spec.caption?`<figcaption>${esc(spec.caption)}</figcaption>`:""}</figure>`;
  }

  // Dil: satır-arası çözümleme / dilbilgisel cinsiyet renk-kodlu cümle (HTML).
  const GLOSS_ROLE={masc:"masc",m:"masc",eril:"masc",fem:"fem",f:"fem",disil:"fem",
    verb:"verb",fiil:"verb",noun:"noun",isim:"noun",ad:"noun",adj:"adj",sifat:"adj",
    article:"art",artikel:"art",det:"art"};
  function glossSentence(spec){
    const toks=(spec.tokens||[]).map(t=>{
      const role=GLOSS_ROLE[String(t.role||"").toLowerCase()]||"";
      const tag=t.tag||t.gloss||"";
      return `<span class="tok"${role?` data-role="${role}"`:""}><span class="w">${esc(t.w||"")}</span>${tag?`<span class="tg">${esc(tag)}</span>`:""}</span>`;
    }).join("");
    const tr=spec.translation?`<p class="gloss-tr">${esc(spec.translation)}</p>`:"";
    const note=spec.note?`<div class="callout callout--info">${icon("ic-info")}<div>${esc(spec.note)}</div></div>`:"";
    const rd=(spec.tokens||[]).map(t=>t.w||"").join(" ")+(spec.translation?". "+spec.translation:"");
    return `<figure class="viz viz--plain"><div class="gloss">${toks}</div>${tr}${spec.caption?`<figcaption>${esc(spec.caption)}</figcaption>`:""}${ttsRow(rd, spec.lang||contentLang())}</figure>${note}`;
  }

  // Dil: iki konuşmacılı diyalog (HTML).
  function dialogue(spec){
    const turns=spec.turns||[];
    const first=(turns[0]&&turns[0].speaker)||"";
    const rows=turns.map(t=>{
      const side=(t.speaker===first)?"a":"b";
      return `<div class="turn turn--${side}"><div class="turn__sp">${esc(t.speaker||"")}</div>`
        +`<div class="turn__b">${esc(t.text||"")}${t.gloss?`<span class="turn__g">${esc(t.gloss)}</span>`:""}</div></div>`;
    }).join("");
    const rd=turns.map(t=>(t.speaker?t.speaker+": ":"")+(t.text||"")).join(". ");
    return `<figure class="viz viz--plain"><div class="dialogue">${rows}</div>${spec.caption?`<figcaption>${esc(spec.caption)}</figcaption>`:""}${ttsRow(rd, spec.lang||contentLang())}</figure>`;
  }

  // Matematik: kanıta dayalı KESİR/ORAN ÇUBUĞU (bar modeli — daire değil).
  //  kind:"fraction" {num,den} · kind:"sum" {addends:[],den} · kind:"ratio" {ratio:[],labels?:[]}
  function fractionBar(spec){
    const kind = spec.kind || (spec.ratio ? "ratio" : (spec.addends ? "sum" : "fraction"));
    const id=vizId(), tid=id+"t", did=id+"d";
    const W=480, BARX=20, BARY=16, BARW=440, BARH=44, EQY=88, H=104;
    const PAL=["var(--accent)","var(--viz-2)","var(--viz-3)","var(--viz-4)","var(--viz-5)"];
    const EMPTY="var(--cds-layer-01)";
    let cells=[], total=0, eq="", desc="", legend="";
    if(kind==="ratio"){
      const r=(spec.ratio||[]).map(n=>Math.max(0,Math.round(+n||0)));
      total=r.reduce((a,b)=>a+b,0)||1;
      r.forEach((cnt,g)=>{ for(let k=0;k<cnt;k++) cells.push(PAL[g%PAL.length]); });
      eq=r.join(" : ");
      const labs=spec.labels||[];
      desc="Oran çubuğu: "+(labs.length?labs.join(", ")+" olmak üzere ":"")+"gruplar "+r.join(" ye ")+" oranında bölünmüş.";
      if(labs.length){ legend=`<div class="viz-legend">`+labs.map((l,i)=>`<span><i style="background:${PAL[i%PAL.length]}"></i>${esc(l)}</span>`).join("")+`</div>`; }
    } else if(kind==="sum"){
      const den=Math.max(1,Math.round(+spec.den||1));
      const ad=(spec.addends||[]).map(n=>Math.max(0,Math.round(+n||0)));
      total=den; let placed=0;
      ad.forEach((cnt,g)=>{ for(let k=0;k<cnt && placed<den;k++){ cells.push(PAL[g%PAL.length]); placed++; } });
      while(placed<den){ cells.push(EMPTY); placed++; }
      const sum=ad.reduce((a,b)=>a+b,0);
      const rhs = sum===den ? "1" : (sum+"\u2044"+den);
      eq=ad.map(a=>a+"\u2044"+den).join(" + ")+" = "+rhs;
      desc="Kesir toplamı: "+ad.map(a=>a+" bölü "+den).join(" artı ")+", toplam "+(sum===den?"bir bütün":sum+" bölü "+den)+".";
    } else {
      const den=Math.max(1,Math.round(+spec.den||1));
      const num=Math.max(0,Math.min(den,Math.round(+spec.num||0)));
      total=den;
      for(let k=0;k<den;k++) cells.push(k<num ? "var(--accent)" : EMPTY);
      eq=num+"\u2044"+den;
      desc="Kesir çubuğu: bütün "+den+" eşit parçaya bölünmüş, "+num+" parça dolu; kesir "+num+" bölü "+den+".";
    }
    const cw=BARW/(total||1);
    let rects="";
    for(let i=0;i<cells.length;i++){
      rects+=`<rect x="${(BARX+i*cw).toFixed(2)}" y="${BARY}" width="${cw.toFixed(2)}" height="${BARH}" fill="${cells[i]}" stroke="var(--cds-border-subtle)" stroke-width="1"/>`;
    }
    const frame=`<rect x="${BARX}" y="${BARY}" width="${BARW}" height="${BARH}" fill="none" stroke="var(--cds-border-strong)" stroke-width="1.5"/>`;
    const eqTxt=`<text class="fb-eq" x="${W/2}" y="${EQY}" text-anchor="middle" font-size="22">${eq}</text>`;
    const title = kind==="ratio" ? "Oran modeli" : (kind==="sum" ? "Kesir toplamı modeli" : "Kesir modeli");
    const svg=`<svg class="viz fraction-bar" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="${tid} ${did}">`
      +`<title id="${tid}">${esc(title)}</title><desc id="${did}">${esc(spec.desc||desc)}</desc>`
      +`${rects}${frame}${eqTxt}</svg>`;
    return `<figure class="viz viz--plain">${svg}${legend}${spec.caption?`<figcaption>${esc(spec.caption)}</figcaption>`:""}</figure>`;
  }

  const renderDiagram  = displaySeg("Şema",            s=>labeledFigure(s.diagram||s));
  const renderFlow      = displaySeg("İlişki",          s=>relationFlow(s.flow||s));
  const renderCards     = displaySeg("Kavramlar",       s=>infoCards(s));
  const renderGloss     = displaySeg("Cümle Çözümleme", s=>glossSentence(s.gloss||s));
  const renderDialogue  = displaySeg("Diyalog",         s=>dialogue(s.dialogue||s));
  const renderFraction  = displaySeg("Kesir",           s=>fractionBar(s.fraction||s));

  function renderSummary(stage){
    stage.setAttribute("data-seg","summary");
    if(breakTimer){ clearTimeout(breakTimer); breakTimer=null; }
    const wb=$("#wellbeing"); if(wb) wb.innerHTML="";
    awardByCondition("module-complete"); playSound("reward");
    const masteryPct = totalGradeable? Math.round((state.mastered/totalGradeable)*100):100;
    const dcolor = masteryPct>=70? "var(--cds-support-success)":"var(--accent)";
    let html=`<div class="summary">${icon(D.meta.coverPictogram||"pic-trophy","pic",80)}
      <h2>Tebrikler${D.learner&&D.learner.name?", "+D.learner.name:""}!</h2>
      <p style="color:var(--cds-text-secondary)">«${D.meta.title}» modülünü tamamladın.</p>
      <div class="summary__row">
        <div class="donut">${donutSvg(masteryPct,dcolor)}
          <div class="donut__center"><span class="donut__pct">%${masteryPct}</span><span class="donut__lbl">Ustalık</span></div></div>
        <div class="stat-col">
          <div class="stat stat--xp">${icon("ic-star")}<div><div class="stat__num">${state.xp}</div><div class="stat__lbl">Toplam XP</div></div></div>
          <div class="stat">${icon("pic-trophy","pic")}<div><div class="stat__num">${state.earnedBadges.size}/${(D.rewards.badges||[]).length}</div><div class="stat__lbl">Rozet</div></div></div>
          ${state.bestStreak>=2?`<div class="stat">${icon("ic-flash")}<div><div class="stat__num">${state.bestStreak}</div><div class="stat__lbl">En uzun seri</div></div></div>`:""}
        </div>
      </div>`;
    if(masteryPct<70){
      html+=`<div class="feedback feedback--info" style="text-align:left">${icon("ic-info")}
        <div>Bazı bölümleri tekrar etmek öğrenmeni pekiştirir. Hazır olduğunda baştan deneyebilirsin.</div></div>`;
    }
    html+=`<div class="callout" style="text-align:left;margin-top:var(--sp-05)">${icon("ic-info")}
      <div><span class="callout__t">Bugünlük bu kadarı yeterli</span>İyi bir çalışma oldu. İstersen şimdi
      bir mola ver; modülü dilediğin zaman tekrar açabilirsin.</div></div>`;
    html+=`</div>`;
    stage.innerHTML=html;
    const restart=el("button","btn btn--primary btn--center");
    restart.style.margin="var(--sp-05) auto 0";
    restart.innerHTML=icon("ic-restart")+" Baştan başla";
    restart.addEventListener("click",()=>{
      state.idx=0;state.xp=0;state.mastered=0;state.awarded.clear();state.done.clear();
      state.earnedBadges.clear();state.flawlessMcq=true;state.streak=0;state.bestStreak=0;
      $("#xpValue").textContent=0; renderBadges(); renderStreak(); render();
    });
    stage.querySelector(".summary").appendChild(restart);
    setNav({back:true,next:false});
    $("#backBtn").style.visibility="visible";
  }

  /* ---- flashcards (aralıklı tekrar: bilinmeyen sona atılır) ---- */
  function renderFlashcards(stage,s){
    let queue = s.cards.map((c,i)=>({front:c.front,back:c.back,hint:c.hint,idx:i}));
    const learned = new Set();
    const total = s.cards.length;
    function show(){
      if(queue.length===0){ goNext(); return; }
      const card = queue[0]; let flipped=false;
      let html = segHead(s,"Kart Destesi")+instr(s);
      html += `<div class="streak">Öğrenilen <b>${learned.size}</b> / <b>${total}</b> · Destede <b>${queue.length}</b> kart</div>`;
      html += `<div class="flash"><div class="card" id="fcard" aria-live="polite">${card.front}</div><div id="fctrl"></div></div>`;
      stage.innerHTML=html;
      setNav({next:false});
      const ctrl=$("#fctrl");
      function renderCtrl(){
        ctrl.innerHTML="";
        if(!flipped){
          const flip=el("button","btn btn--primary btn--center"); flip.innerHTML=icon("ic-view")+" Çevir";
          flip.addEventListener("click",()=>{
            flipped=true; const fc=$("#fcard"); fc.className="card card--back";
            fc.innerHTML='<div class="fc-back"><div class="fc-back__def">'+card.back+'</div>'
              +(card.hint?'<div class="fc-hint">'+icon("ic-help")+'<span><b>İpucu:</b> '+card.hint+'</span></div>':'')
              +ttsBtn(stripTags(card.back)+(card.hint?". İpucu: "+stripTags(card.hint):""), (card.lang||defLang()))
              +'</div>';
            renderCtrl();
          });
          ctrl.appendChild(flip);
        } else {
          const row=el("div"); row.style.cssText="display:flex;gap:var(--sp-05);justify-content:center;flex-wrap:wrap;margin-top:var(--sp-05)";
          const know=el("button","btn btn--primary"); know.innerHTML=icon("ic-check")+" Biliyorum";
          const again=el("button","btn btn--ghost"); again.innerHTML=icon("ic-renew")+" Tekrar et";
          know.addEventListener("click",()=>{
            if(!learned.has(card.idx)){ learned.add(card.idx); addXP(D.rewards.xpPerCorrect); markMastered(); bumpStreak(); }
            queue.shift(); show();
          });
          again.addEventListener("click",()=>{ const c=queue.shift(); queue.push(c); show(); });
          row.appendChild(know); row.appendChild(again); ctrl.appendChild(row);
        }
      }
      renderCtrl();
    }
    show();
  }

  /* ---- order (sıraya diz: sıradaki doğruyu seç) ---- */
  function renderOrder(stage,s){
    const shown = s.items.map((t,i)=>({t,correct:i}));
    for(let i=shown.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shown[i],shown[j]]=[shown[j],shown[i]];}
    let expected=0;
    let html=segHead(s,"Sıraya Diz")+instr(s);
    if(s.prompt) html+=`<p class="q-stem">${s.prompt}</p>`;
    html+=`<div class="opt-list" role="group" aria-label="Sıralanacak öğeler">`;
    shown.forEach(it=>{ html+=`<button class="opt" type="button" data-c="${it.correct}"><span class="opt__mark"></span><span>${it.t}</span></button>`; });
    html+=`</div><div id="ofb" aria-live="polite"></div>`;
    stage.innerHTML=html;
    setNav({next:false});
    stage.querySelectorAll(".opt").forEach(btn=>{
      btn.addEventListener("click",()=>{
        if(btn.disabled) return;
        if(+btn.dataset.c===expected){
          btn.classList.add("opt--correct"); btn.disabled=true;
          btn.querySelector(".opt__mark").innerHTML=`<span style="font-family:var(--font-mono);font-weight:700;color:var(--cds-support-success)">${expected+1}</span>`;
          const gk=s.id+"#"+expected;
          if(!state.awarded.has(gk)){state.awarded.add(gk);addXP(D.rewards.xpPerCorrect);markMastered();bumpStreak();}
          expected++;
          if(expected===shown.length){
            const fb=$("#ofb"); fb.className="feedback feedback--ok";
            fb.innerHTML=icon("ic-check")+`<div><b>Doğru sıra!</b></div>`;
            setNav({nextLabel: state.idx===segs.length-1?"Bitir":"Devam"});
          }
        } else {
          const fb=$("#ofb"); fb.className="feedback feedback--no"; resetStreak();
          fb.innerHTML=icon("ic-close")+`<div><b>Sıradaki bu değil.</b> ${expected+1}. sırada gelecek öğeyi seç.</div>`;
          const b=btn; b.classList.add("opt--wrong"); setTimeout(()=>b.classList.remove("opt--wrong"),500);
        }
      });
    });
  }

  /* ---- sorting (gruplara ayır: her öğeyi doğru kutuya) ---- */
  function renderSorting(stage,s){
    let ii=0;
    function show(){
      const it=s.items[ii];
      let html=segHead(s,"Gruplara Ayır")+instr(s);
      if(s.prompt) html+=`<p class="q-stem">${s.prompt}</p>`;
      html+=`<div class="streak">Öğe <b>${ii+1}</b> / <b>${s.items.length}</b></div>`;
      html+=`<div class="card" style="min-height:auto;padding:var(--sp-06);font-size:var(--fs-h-sub)">${it.label}</div>`;
      html+=`<div class="opt-list" role="group" aria-label="Kategoriler">`;
      s.bins.forEach((b,bi)=>{ html+=`<button class="opt" type="button" data-bin="${bi}"><span class="opt__mark"></span><span>${b}</span></button>`; });
      html+=`</div><div id="sfb" aria-live="polite"></div>`;
      stage.innerHTML=html;
      setNav({next:false});
      const gk=s.id+"#"+ii;
      stage.querySelectorAll(".opt").forEach(btn=>{
        btn.addEventListener("click",()=>{
          if(btn.disabled) return;
          if(+btn.dataset.bin===it.bin){
            btn.classList.add("opt--correct"); btn.querySelector(".opt__mark").innerHTML=icon("ic-check");
            stage.querySelectorAll(".opt").forEach(b=>b.disabled=true);
            if(!state.awarded.has(gk)){state.awarded.add(gk);addXP(D.rewards.xpPerCorrect);markMastered();bumpStreak();}
            const fb=$("#sfb"); fb.className="feedback feedback--ok";
            fb.innerHTML=icon("ic-check")+`<div><b>Doğru!</b> «${it.label}» &#8594; ${s.bins[it.bin]}</div>`;
            const last=ii===s.items.length-1;
            const nb=el("button","btn btn--primary"); nb.style.marginTop="var(--sp-05)";
            nb.innerHTML=(last?"Tamamla":"Sonraki")+" "+icon("ic-arrow-right");
            nb.addEventListener("click",()=>{ if(last){goNext();} else {ii++;show();} });
            stage.appendChild(nb);
          } else {
            btn.classList.add("opt--wrong"); btn.disabled=true;
            const fb=$("#sfb"); fb.className="feedback feedback--no"; resetStreak();
            fb.innerHTML=icon("ic-close")+`<div><b>Bu kategori değil.</b> Tekrar dene.</div>`;
          }
        });
      });
    }
    show();
  }

  /* ---- hotspot (görselde doğru bölgeyi bul ve tıkla) ---- */
  function renderHotspot(stage,s){
    let pi=0;
    function show(){
      const sp=s.spots[pi];
      let html=segHead(s,"Görseli Keşfet")+instr(s);
      html+=`<div class="streak">İpucu <b>${pi+1}</b> / <b>${s.spots.length}</b></div>`;
      html+=`<p class="q-stem">Bul ve tıkla: <span style="color:var(--accent-strong)">${sp.label}</span></p>`;
      html+=`<div class="visual hotspot-wrap">${s.svg}</div><div id="hfb" aria-live="polite"></div>`;
      stage.innerHTML=html;
      setNav({next:false});
      stage.querySelectorAll("[data-spot]").forEach(r=>{
        const meta=(s.spots.find(x=>x.id===r.getAttribute("data-spot"))||{});
        r.setAttribute("role","button"); r.setAttribute("tabindex","0");
        r.setAttribute("aria-label", meta.label||"bölge");
        const handler=()=>{
          if(r.dataset.done) return;
          if(r.getAttribute("data-spot")===sp.id){
            r.dataset.done="1"; r.style.outline="3px solid var(--cds-support-success)"; r.style.outlineOffset="2px";
            const gk=s.id+"#"+pi;
            if(!state.awarded.has(gk)){state.awarded.add(gk);addXP(D.rewards.xpPerCorrect);markMastered();}
            const fb=$("#hfb"); fb.className="feedback feedback--ok";
            fb.innerHTML=icon("ic-check")+`<div><b>Buldun!</b> ${sp.info||""}</div>`;
            const last=pi===s.spots.length-1;
            const nb=el("button","btn btn--primary"); nb.style.marginTop="var(--sp-05)";
            nb.innerHTML=(last?"Tamamla":"Sonraki")+" "+icon("ic-arrow-right");
            nb.addEventListener("click",()=>{ if(last){goNext();} else {pi++;show();} });
            stage.appendChild(nb);
          } else {
            const fb=$("#hfb"); fb.className="feedback feedback--no";
            fb.innerHTML=icon("ic-close")+`<div><b>Burası değil.</b> «${sp.label}» nerede olabilir? Tekrar dene.</div>`;
          }
        };
        r.addEventListener("click",handler);
        r.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();handler();} });
      });
    }
    show();
  }

  /* ---- timeline (zaman çizelgesi — display materyali, notsuz) ---- */
  function renderTimeline(stage,s){
    let html=segHead(s,"Zaman Çizelgesi")+instr(s);
    if(s.prompt) html+=`<p class="lead">${s.prompt}</p>`;
    html+=`<ol class="timeline">`;
    (s.events||[]).forEach((e,i)=>{
      html+=`<li class="tl-item"><div class="tl-node">${i+1}</div>
        <div class="tl-card">${e.date?`<div class="tl-when">${e.date}</div>`:""}
        <div class="tl-label">${e.label||""}</div>
        ${e.detail?`<div class="tl-detail">${e.detail}</div>`:""}</div></li>`;
    });
    html+=`</ol>`;
    stage.innerHTML=html;
    setNav({nextLabel: state.idx===segs.length-1?"Bitir":"Devam"});
  }

  init();
})();

/* ===== Carbon DefinitionTooltip — anahtar kavram tanım popover'ı =====
   .def-term tetikleyicilerine hover/odakla tema-duyarlı, oklu, ekran
   kenarına uyarlanan (flip + clamp) tanım kartı. Olay delegasyonu ile
   stage yeniden render edilse de çalışır; aria-describedby ile erişilebilir. */
(function(){
  var pop=document.createElement("div");
  pop.className="def-pop"; pop.id="defPop"; pop.setAttribute("role","tooltip"); pop.hidden=true;
  pop.innerHTML='<span class="def-pop__head"><span class="def-pop__ic" aria-hidden="true"></span><span class="def-pop__term"></span></span><span class="def-pop__def"></span><span class="def-pop__ex" hidden><span class="def-pop__ex-lbl">Örnek</span><span class="def-pop__ex-t"></span></span><span class="def-pop__arrow" aria-hidden="true"></span>';
  document.body.appendChild(pop);
  var cur=null;
  function place(btn){
    var r=btn.getBoundingClientRect(), m=12, gap=10;
    var pw=pop.offsetWidth, ph=pop.offsetHeight;
    var left=r.left+r.width/2-pw/2;
    left=Math.max(m, Math.min(left, window.innerWidth-pw-m));
    var top=r.top-ph-gap, pos="top";
    if(top<m){ top=r.bottom+gap; pos="bottom"; }
    pop.style.left=left+"px"; pop.style.top=top+"px"; pop.setAttribute("data-place",pos);
    pop.style.setProperty("--arrow-x",(r.left+r.width/2-left)+"px");
  }
  function show(btn){
    cur=btn;
    var ic=(btn.getAttribute("data-icon")||"").replace(/[^a-z0-9-]/gi,"");
    var ich=pop.querySelector(".def-pop__ic");
    ich.innerHTML= ic? '<svg class="cds-icon" aria-hidden="true"><use href="#'+ic+'"></use></svg>' : "";
    ich.style.display= ic? "" : "none";
    pop.querySelector(".def-pop__term").textContent=btn.getAttribute("data-term")||"";
    pop.querySelector(".def-pop__def").textContent=btn.getAttribute("data-def")||"";
    var ex=btn.getAttribute("data-ex")||"";
    pop.querySelector(".def-pop__ex-t").textContent=ex;
    pop.querySelector(".def-pop__ex").hidden=!ex;
    pop.hidden=false; btn.setAttribute("aria-describedby","defPop"); place(btn);
  }
  function hide(btn){
    if(btn&&btn!==cur) return;
    pop.hidden=true; if(cur) cur.removeAttribute("aria-describedby"); cur=null;
  }
  function near(e){ return (e.target&&e.target.closest)?e.target.closest(".def-term"):null; }
  document.addEventListener("mouseover",function(e){ var b=near(e); if(b) show(b); });
  document.addEventListener("mouseout",function(e){ var b=near(e); if(b){ var t=e.relatedTarget; if(!t||!t.closest||!t.closest(".def-term")) hide(b); } });
  document.addEventListener("focusin",function(e){ var b=near(e); if(b) show(b); });
  document.addEventListener("focusout",function(e){ var b=near(e); if(b) hide(b); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&cur) hide(cur); });
  window.addEventListener("scroll",function(){ if(cur) place(cur); },true);
  window.addEventListener("resize",function(){ if(cur) hide(cur); });
})();
</script>
